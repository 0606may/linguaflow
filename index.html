<title>LinguaFlow - 英语德语学习工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5b6e7a;--primary-light:#7d8b8f;--primary-dark:#4a5d69;
  --accent:#b09878;--accent-light:#c4ad96;
  --warn:#c4816b;
  --bg:#f5f2ed;--card:#fafaf8;--sidebar-bg:#5b6e7a;--sidebar-text:#c5cdd1;
  --text:#3a3a3a;--text-secondary:#8c8c8c;--border:#e0dcd5;
  --success:#7a9a7e;--danger:#c4816b;--warning:#c4816b;
  --highlight:#eee9e1;--highlight-sentence:#f0ebe4;
  --shadow:0 1px 3px rgba(0,0,0,.03);--shadow-lg:0 4px 12px rgba(0,0,0,.06);
  --radius:8px;--radius-sm:6px;--radius-tag:4px;
}
body{font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
/* 移动端：消除点击黄色高亮/焦点光圈/异常选中光标 */
*{-webkit-tap-highlight-color:transparent}
button,a,input,select,textarea{outline:none}
input,textarea{caret-color:#5b6e7a}
::selection{background:rgba(91,110,122,.22);color:inherit}
/* Sidebar */
.sidebar{width:220px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-brand{padding:20px;font-size:20px;font-weight:700;color:#f5f2ed;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);letter-spacing:1px}
.sidebar-brand small{display:block;font-size:11px;font-weight:400;color:var(--sidebar-text);margin-top:4px;letter-spacing:0}
.sidebar-section{padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#8a9ba3}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:all .2s;font-size:14px;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(255,255,255,.06);color:#f5f2ed}
.sidebar-item.active{background:rgba(176,152,120,.25);color:#f5f2ed;border-left-color:var(--accent)}
.sidebar-item .icon{font-size:18px;width:24px;text-align:center}
.lang-switch{display:flex;margin:8px 16px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.lang-btn{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.lang-btn.active{background:var(--accent);color:#f5f2ed}
.lang-btn:not(.active):hover{background:rgba(255,255,255,.06)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-title{font-size:18px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.content{flex:1;overflow-y:auto;padding:20px 24px}
/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;color:var(--text)}
.btn:hover{background:var(--highlight)}
.btn-primary{background:var(--primary);color:#f5f2ed;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#f5f2ed;border-color:var(--accent)}
.btn-accent:hover{background:#9e8768}
.btn-success{background:var(--success);color:#f5f2ed;border-color:var(--success)}
.btn-danger{background:var(--warn);color:#f5f2ed;border-color:var(--warn)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:16px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
/* Controls */
.control-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.control-label{font-size:12px;color:var(--text-secondary);min-width:50px}
.speed-slider{-webkit-appearance:none;width:120px;height:4px;border-radius:2px;background:var(--border);outline:none}
.speed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer}
.speed-val{font-size:12px;font-weight:600;color:var(--accent);min-width:32px}
select.ctrl-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card);cursor:pointer}
/* Search bar (unified for all modules) */
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--card);color:var(--text);outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--text-secondary)}
/* Material list */
.material-list{display:flex;flex-direction:column;gap:8px}
.material-card{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.material-card:hover{border-color:var(--accent-light);background:var(--highlight)}
.material-card.active{border-color:var(--accent);background:var(--highlight-sentence);box-shadow:0 0 0 2px rgba(176,152,120,.12)}
.material-card .mc-title{font-size:14px;font-weight:600}
.material-card .mc-meta{font-size:12px;color:var(--text-secondary);margin-top:3px}
.theme-badge{display:inline-block;padding:2px 8px;border-radius:var(--radius-tag);font-size:11px;font-weight:500}
.theme-badge.daily{background:#e8e4dd;color:#5b6e7a}
.theme-badge.business{background:#eee9e1;color:#8c7a5e}
.theme-badge.culture{background:#e4e8e4;color:#5e7a62}
.theme-badge.exam{background:#ece4e0;color:#9a6b5e}
/* Bilingual text */
.bilingual-block{margin:8px 0;padding:10px 14px;border-radius:var(--radius-sm);line-height:1.8;transition:background .2s}
.bilingual-block:hover{background:var(--highlight)}
.bilingual-block.highlight{background:var(--highlight-sentence);border-left:3px solid var(--accent)}
.bilingual-block.playing{background:#f0ebe4;border-left:3px solid var(--accent)}
.sentence-orig{font-size:16px;font-weight:500;cursor:pointer}
.sentence-orig .word{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s}
.sentence-orig .word:hover{background:var(--highlight)}
.sentence-orig .word.looked-up{background:#e4e8e4;border-bottom:2px solid var(--success)}
.sentence-trans{font-size:14px;color:var(--text-secondary);margin-top:2px}
.sentence-idx{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--highlight);font-size:11px;color:var(--text-secondary);margin-right:8px;flex-shrink:0}
/* Archive checkbox on sentences */
.archive-check{display:inline-flex;align-items:center;gap:4px;margin-left:8px;cursor:pointer;font-size:12px;color:var(--text-secondary);transition:color .15s}
.archive-check:hover{color:var(--accent)}
.archive-check.checked{color:var(--success)}
/* Dictionary popup */
.dict-popup{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;min-width:240px;max-width:320px;z-index:1000;display:none}
.dict-popup.show{display:block}
.dict-word{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:4px}
.dict-phonetic{font-size:13px;color:var(--text-secondary);margin-bottom:8px}
.dict-meaning{font-size:14px;line-height:1.6}
.dict-meaning .pos{color:var(--accent);font-weight:600;margin-right:6px}
.dict-close{position:absolute;top:8px;right:10px;cursor:pointer;font-size:18px;color:var(--text-secondary)}
/* Grammar area */
/* Quiz */
.quiz-input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border-color .2s}
.quiz-input:focus{border-color:var(--primary)}
.quiz-input.correct{border-color:var(--success);background:#edf3ee}
.quiz-input.wrong{border-color:var(--warn);background:#f5eae6}
.quiz-feedback{margin-top:8px;padding:10px;border-radius:var(--radius-sm);font-size:14px;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:#edf3ee;color:#4a6b4e}
.quiz-feedback.wrong{background:#f5eae6;color:#8a4a3a}
/* Import */
.import-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.import-zone:hover{border-color:var(--primary);color:var(--primary)}
.import-zone.dragover{border-color:var(--primary);background:var(--highlight-sentence)}
/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 18px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* 移动端专属控件：桌面端默认隐藏（手机宽度由下方媒体查询重新显示） */
.mobile-lang-switch,.mobile-module-bar{display:none}
/* Responsive */
@media(max-width:768px){
  .sidebar{width:60px}.sidebar-brand small,.sidebar-item span,.sidebar-section{display:none}.sidebar-brand{font-size:14px;padding:14px 4px}.sidebar-item{padding:12px;justify-content:center;border-left:none;border-right:3px solid transparent}.sidebar-item.active{border-left:none;border-right-color:var(--accent)}.lang-switch{flex-direction:column;margin:4px 8px}.grid-2{grid-template-columns:1fr}
}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c5c0b8;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#a8a298}
/* Animation */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
/* Record indicator */
.recording-indicator{display:inline-flex;align-items:center;gap:6px;color:var(--danger);font-size:13px;font-weight:600}
.recording-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Word bank */
.word-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.word-chip{padding:4px 10px;background:var(--highlight);border-radius:14px;font-size:12px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.word-chip:hover{background:var(--highlight-sentence);border-color:var(--accent-light)}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-text{font-size:15px}
/* Progress & Dashboard */
.progress-bar-bg{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.stat-card{text-align:center;padding:16px;background:var(--highlight);border-radius:var(--radius-sm)}
.stat-card .stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:600}
.streak-fire{font-size:20px;animation:flicker 1.5s infinite alternate}
@keyframes flicker{0%{transform:scale(1)}100%{transform:scale(1.15)}}
.recommend-card{padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;margin-bottom:8px}
.recommend-card:hover{border-color:var(--primary-light);background:var(--highlight-sentence)}
.recommend-card .rc-title{font-size:14px;font-weight:600}
.recommend-card .rc-reason{font-size:12px;color:var(--primary);margin-top:3px}
.duo-sync-box{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:var(--radius);padding:16px;color:#f5f2ed;margin-bottom:16px}
.duo-sync-box .dsb-title{font-weight:700;font-size:15px;margin-bottom:8px}
.duo-sync-box .dsb-row{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:4px}
.target-box{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:var(--radius);padding:16px;color:#f5f2ed;margin-bottom:16px}
.target-box .tb-title{font-weight:700;font-size:15px;margin-bottom:4px}
.target-box .tb-sub{font-size:13px;opacity:.85}
.activity-day{margin-bottom:16px}
.activity-day .ad-date{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.activity-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.activity-item .ai-icon{width:24px;text-align:center;font-size:14px}
.activity-item .ai-text{flex:1}
.activity-item .ai-time{color:var(--text-secondary);font-size:11px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px}
.setting-value{display:flex;align-items:center;gap:8px}
.duo-owl{font-size:32px;margin-right:8px}
/* Query module */
.query-box{position:relative}
.query-input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:15px;outline:none;transition:border-color .2s}
.query-input:focus{border-color:var(--primary)}
.query-result{margin-top:16px;animation:fadeIn .3s}
.grammar-card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;cursor:pointer;transition:all .15s}
.grammar-card:hover{border-color:var(--primary-light);background:var(--highlight-sentence)}
.grammar-card .gc-title{font-weight:600;font-size:14px;color:var(--primary);margin-bottom:4px}
.grammar-card .gc-preview{font-size:13px;color:var(--text-secondary)}
.grammar-detail{padding:16px;background:var(--highlight);border-radius:var(--radius-sm);margin-bottom:12px;border-left:3px solid var(--accent);animation:fadeIn .2s}
.grammar-detail .gd-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:8px}
.grammar-detail .gd-content{font-size:14px;line-height:1.8;white-space:pre-line}
.grammar-detail .gd-example{margin-top:8px;padding:8px 12px;background:var(--card);border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border)}
.dict-result{padding:16px;background:var(--highlight);border-radius:var(--radius-sm);margin-bottom:12px}
.dict-result .dr-word{font-size:22px;font-weight:700;color:var(--primary)}
.dict-result .dr-phonetic{font-size:13px;color:var(--text-secondary);margin:4px 0 8px}
.dict-result .dr-meaning{font-size:14px;line-height:1.8}
.dict-result .dr-meaning .pos{color:var(--primary);font-weight:600;margin-right:6px}
/* Notes module */
.note-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)}
.note-tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.note-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.note-tab:hover{color:var(--text)}
.note-item{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:all .15s}
.note-item:hover{border-color:var(--primary-light)}
.note-item .ni-content{font-size:14px;font-weight:600}
.note-item .ni-detail{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.6}
.note-item .ni-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--text-secondary)}
/* Spot quiz */
.spot-card{padding:20px;text-align:center;background:linear-gradient(135deg,var(--highlight),var(--card));border-radius:var(--radius);margin-bottom:16px}
.spot-question{font-size:18px;font-weight:700;color:var(--text);margin:16px 0}
.spot-answer{font-size:15px;color:var(--success);margin-top:12px;animation:fadeIn .3s}
.spot-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.spot-opt{padding:10px 20px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;transition:all .15s;background:var(--card)}
.spot-opt:hover{border-color:var(--accent-light);background:var(--highlight-sentence)}
.spot-opt.correct{border-color:var(--success);background:#edf3ee;color:var(--success)}
.spot-opt.wrong{border-color:var(--warn);background:#f5eae6;color:var(--warn)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Photo Upload */
.upload-panel{background:var(--highlight);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;animation:fadeIn .3s}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--card)}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--highlight-sentence)}
.upload-zone .uz-icon{font-size:36px;margin-bottom:8px}
.upload-zone .uz-text{font-size:14px;color:var(--text-secondary)}
.upload-zone .uz-hint{font-size:12px;color:var(--text-secondary);margin-top:4px;opacity:.7}
.upload-preview{position:relative;display:inline-block;max-width:100%;margin:12px 0}
.upload-preview img{max-width:100%;max-height:300px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.upload-preview .up-remove{position:absolute;top:-8px;right:-8px;width:24px;height:24px;background:var(--danger);color:#f5f2ed;border:none;border-radius:50%;cursor:pointer;font-size:14px;line-height:24px;text-align:center}
.ocr-progress{margin:12px 0}
.ocr-progress .op-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.ocr-progress .op-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .3s}
.ocr-progress .op-label{font-size:12px;color:var(--text-secondary);margin-top:4px;text-align:center}
.ocr-result{margin-top:12px}

<script>
// Load Tesseract.js on demand (avoid blocking page load if CDN is unreachable)
let _tesseractLoaded = false;
let _tesseractLoading = false;
function loadTesseract(){
  if(_tesseractLoaded) return Promise.resolve(window.Tesseract);
  if(_tesseractLoading) return new Promise(r => { const iv = setInterval(() => { if(_tesseractLoaded){clearInterval(iv);r(window.Tesseract)} }, 200); });
  _tesseractLoading = true;
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = () => { _tesseractLoaded = true; resolve(window.Tesseract); };
    s.onerror = () => { _tesseractLoading = false; reject(new Error('Tesseract.js load failed')); };
    document.head.appendChild(s);
  });
}
</script>

     {orig:"It was lovely talking to you. Let's keep in touch!",trans:"和你聊天很愉快。我们保持联系吧！"},
     {orig:"Have a wonderful day! See you tomorrow.",trans:"祝你有美好的一天！明天见。"},
     {orig:"Could you introduce yourself to the team? Sure, I'd be happy to.",trans:"你能向团队做个自我介绍吗？当然，我很乐意。"}
   ]},
  {id:'en-daily-2',lang:'en',theme:'daily',difficulty:'基础',title:'Shopping & Dining 购物与餐饮',
   sentences:[
     {orig:"Excuse me, how much is this shirt? It's 29 dollars.",trans:"打扰一下，这件衬衫多少钱？29美元。"},
     {orig:"Could I try this on? Of course, the fitting room is over there.",trans:"我能试穿一下吗？当然，试衣间在那边。"},
     {orig:"I'd like to order a cup of coffee and a piece of cake, please.",trans:"我想点一杯咖啡和一块蛋糕。"},
     {orig:"Could I see the menu, please? Here you go.",trans:"请给我看一下菜单，好吗？给你。"},
     {orig:"The food here is absolutely delicious. I highly recommend the pasta.",trans:"这里的食物非常好吃。我强烈推荐意面。"},
     {orig:"Can I pay by credit card? Yes, we accept all major cards.",trans:"可以刷信用卡吗？是的，我们接受所有主流信用卡。"},
     {orig:"I'm just browsing, thank you. No problem, take your time.",trans:"我只是随便看看，谢谢。没问题，您慢慢看。"},
     {orig:"Could we get the bill, please? I'll bring it right away.",trans:"请给我们账单好吗？我马上拿来。"}
   ]},
  {id:'en-daily-3',lang:'en',theme:'daily',difficulty:'基础',title:'Travel & Directions 出行与问路',
   sentences:[
     {orig:"Excuse me, could you tell me how to get to the nearest subway station?",trans:"打扰一下，你能告诉我去最近的地铁站怎么走吗？"},
     {orig:"Go straight for two blocks, then turn left. You can't miss it.",trans:"直走两个街区，然后左转。你一定能找到。"},
     {orig:"How long does it take to get there by bus? About thirty minutes, depending on traffic.",trans:"坐公交车到那里要多久？大约三十分钟，取决于交通状况。"},
     {orig:"I'd like to book a room for two nights. Do you have any vacancies?",trans:"我想订一间房住两晚。你们有空房吗？"},
     {orig:"What time does the flight depart? The flight departs at 3:30 PM.",trans:"航班几点起飞？航班下午三点三十起飞。"},
     {orig:"Could you call me a taxi, please? I'll call one for you right now.",trans:"能帮我叫辆出租车吗？我现在就帮你叫。"},
     {orig:"Is there a convenience store nearby? Yes, there's one just around the corner.",trans:"附近有便利店吗？有的，拐角处就有一家。"},
     {orig:"I'm lost. Can you show me where we are on the map?",trans:"我迷路了。你能在地图上指给我看我们在哪里吗？"}
   ]},
  {id:'en-daily-4',lang:'en',theme:'daily',difficulty:'进阶',title:'Health & Lifestyle 健康与生活',
   sentences:[
     {orig:"I haven't been feeling well lately. I have a headache and a sore throat.",trans:"我最近不太舒服。我头疼，嗓子也疼。"},
     {orig:"You should see a doctor and get some rest. Don't push yourself too hard.",trans:"你应该去看医生，多休息。别太勉强自己。"},
     {orig:"I've been trying to exercise regularly. I go jogging every morning.",trans:"我一直在坚持锻炼。我每天早上去慢跑。"},
     {orig:"A balanced diet is essential for good health. Eat more fruits and vegetables.",trans:"均衡饮食对健康至关重要。多吃水果和蔬菜。"},
     {orig:"I need to make an appointment with the dentist. Do you have any availability this week?",trans:"我需要预约牙医。你这周有空档吗？"},
     {orig:"Taking a walk after dinner is a great habit. It helps with digestion.",trans:"饭后散步是个好习惯。有助于消化。"},
     {orig:"I'm trying to cut down on sugar. It's better for your health in the long run.",trans:"我在试着减少糖的摄入。从长远来看对你的健康更好。"}
   ]},
  {id:'en-biz-1',lang:'en',theme:'business',difficulty:'进阶',title:'Business Emails 商务邮件',
   sentences:[
     {orig:"Dear Mr. Johnson, I am writing to follow up on our meeting last Tuesday.",trans:"尊敬的Johnson先生，我写信是为了跟进上周二的会议。"},
     {orig:"Thank you for your prompt reply. We appreciate your quick response.",trans:"感谢您的及时回复。我们感谢您的迅速回应。"},
     {orig:"Please find attached the quarterly report for your review.",trans:"请查收附件中的季度报告供您审阅。"},
     {orig:"I would like to schedule a meeting to discuss the project timeline.",trans:"我想安排一个会议来讨论项目时间表。"},
     {orig:"Could you please provide an update on the current status of the contract?",trans:"您能否提供合同当前状态的更新？"},
     {orig:"We look forward to hearing from you at your earliest convenience.",trans:"我们期待在您方便时尽早收到您的回复。"},
     {orig:"Please do not hesitate to contact me if you have any questions or concerns.",trans:"如果您有任何问题或疑虑，请随时联系我。"},
     {orig:"I am writing to confirm our agreement regarding the delivery schedule.",trans:"我写信确认我们关于交付时间表的协议。"}
   ]},
  {id:'en-biz-2',lang:'en',theme:'business',difficulty:'进阶',title:'Meetings & Presentations 会议与演示',
   sentences:[
     {orig:"Let's get started. Thank you all for coming on such short notice.",trans:"我们开始吧。感谢大家在这么短的时间内赶来。"},
     {orig:"I'd like to go over the agenda for today's meeting. We have three items to cover.",trans:"我想过一下今天会议的议程。我们有三个议题要讨论。"},
     {orig:"Could you elaborate on that point? I think we need more details.",trans:"你能详细说明一下那个观点吗？我觉得我们需要更多细节。"},
     {orig:"Let me share my screen to walk you through the data analysis.",trans:"让我共享屏幕，带你们看一下数据分析。"},
     {orig:"Based on the numbers, I'd recommend we focus on improving efficiency.",trans:"根据数据，我建议我们专注于提高效率。"},
     {orig:"Does anyone have any questions before we move on to the next topic?",trans:"在进入下一个话题之前，有人有问题吗？"},
     {orig:"To sum up, we've agreed on the action items and deadlines.",trans:"总结一下，我们已经商定了行动项目和截止日期。"},
     {orig:"Great meeting everyone. Let's reconvene next Monday to review progress.",trans:"很高兴和大家开会。我们下周一再碰面回顾进展。"}
   ]},
  {id:'en-biz-3',lang:'en',theme:'business',difficulty:'进阶',title:'Reports & Approvals 汇报与审批',
   sentences:[
     {orig:"I'd like to present the monthly performance report for your review.",trans:"我想提交月度绩效报告供您审阅。"},
     {orig:"The approval process requires signatures from three department heads.",trans:"审批流程需要三个部门负责人的签字。"},
     {orig:"We've identified a bottleneck in the workflow that's causing delays.",trans:"我们发现工作流中有一个导致延误的瓶颈。"},
     {orig:"The budget proposal has been submitted for management approval.",trans:"预算提案已提交管理层审批。"},
     {orig:"Could you expedite the approval? The project deadline is approaching.",trans:"您能加快审批吗？项目截止日期快到了。"},
     {orig:"All key performance indicators are trending positively this quarter.",trans:"本季度所有关键绩效指标都呈积极趋势。"},
     {orig:"I recommend we allocate additional resources to the high-priority tasks.",trans:"我建议我们给高优先级任务分配更多资源。"},
     {orig:"The risk assessment indicates we need to strengthen our compliance measures.",trans:"风险评估表明我们需要加强合规措施。"}
   ]},
  {id:'en-culture-1',lang:'en',theme:'culture',difficulty:'进阶',title:'Western Business Culture 西方商务文化',
   sentences:[
     {orig:"In Western business culture, punctuality is considered a sign of professionalism.",trans:"在西方商务文化中，守时被视为专业素养的标志。"},
     {orig:"Networking events are a great opportunity to build professional relationships.",trans:"社交活动是建立职业关系的绝佳机会。"},
     {orig:"Americans tend to value direct communication and getting straight to the point.",trans:"美国人倾向于重视直接沟通和直奔主题。"},
     {orig:"In British business culture, a firm handshake is the standard greeting.",trans:"在英国商务文化中，有力的握手是标准的问候方式。"},
     {orig:"Small talk before meetings is common and helps build rapport with colleagues.",trans:"会前闲聊很常见，有助于与同事建立融洽关系。"},
     {orig:"Understanding cultural differences is key to successful international business.",trans:"理解文化差异是国际商务成功的关键。"},
     {orig:"In many Western companies, the dress code has become increasingly casual.",trans:"在许多西方公司，着装要求变得越来越休闲。"}
   ]},
  {id:'en-culture-2',lang:'en',theme:'culture',difficulty:'进阶',title:'Technology & Innovation 科技与创新',
   sentences:[
     {orig:"Artificial intelligence is transforming the way we work and communicate.",trans:"人工智能正在改变我们工作和交流的方式。"},
     {orig:"Cloud computing has made it possible for teams to collaborate from anywhere.",trans:"云计算使团队可以在任何地方协作。"},
     {orig:"The Internet of Things connects everyday devices to the internet for smarter living.",trans:"物联网将日常设备连接到互联网，实现更智能的生活。"},
     {orig:"Cybersecurity is becoming increasingly important as more data moves online.",trans:"随着更多数据转移到线上，网络安全变得越来越重要。"},
     {orig:"Remote work has become the new normal for many companies around the world.",trans:"远程办公已成为全球许多公司的新常态。"},
     {orig:"Sustainable technology aims to reduce our environmental impact while maintaining growth.",trans:"可持续技术旨在减少环境影响的同时保持增长。"}
   ]},
  {id:'en-exam-1',lang:'en',theme:'exam',difficulty:'进阶',title:'TOEIC Practice - Office 托业练习 - 办公',
   sentences:[
     {orig:"The office supply order has been placed and should arrive by Friday.",trans:"办公用品订单已下达，应该在周五前到达。"},
     {orig:"All employees are required to attend the safety training session next week.",trans:"所有员工都必须参加下周的安全培训。"},
     {orig:"Please submit your expense reports before the end of the month.",trans:"请在月底前提交您的费用报告。"},
     {orig:"The conference room has been reserved for the client presentation on Wednesday.",trans:"会议室已预留用于周三的客户演示。"},
     {orig:"Our company policy requires all visitors to sign in at the reception desk.",trans:"我们公司的政策要求所有访客在前台签到。"},
     {orig:"The annual performance reviews will be conducted throughout the month of March.",trans:"年度绩效评估将在整个三月进行。"},
     {orig:"Due to the renovation, the cafeteria will be temporarily relocated to the second floor.",trans:"由于装修，食堂将临时搬到二楼。"}
   ]},
  // ---- GERMAN ----
  {id:'de-daily-1',lang:'de',theme:'daily',difficulty:'入门',title:'Begrüßung & Vorstellung 问候与介绍',
   sentences:[
     {orig:"Guten Morgen! Ich heiße Li Ming. Wie heißen Sie?",trans:"早上好！我叫李明。您叫什么名字？"},
     {orig:"Freut mich, Sie kennenzulernen. Ich komme aus China.",trans:"很高兴认识您。我来自中国。"},
     {orig:"Woher kommen Sie? Ich komme aus Peking, der Hauptstadt von China.",trans:"您从哪里来？我来自北京，中国的首都。"},
     {orig:"Wie geht es Ihnen heute? Danke, sehr gut! Und Ihnen?",trans:"您今天怎么样？谢谢，很好！您呢？"},
     {orig:"Was machen Sie beruflich? Ich bin Projektmanagerin.",trans:"您做什么工作？我是项目经理。"},
     {orig:"Es war schön, mit Ihnen zu sprechen. Lassen Sie uns in Kontakt bleiben!",trans:"和您交谈很愉快。我们保持联系吧！"},
     {orig:"Ich wünsche Ihnen einen schönen Tag! Bis morgen!",trans:"祝您有美好的一天！明天见！"},
     {orig:"Sprechen Sie Englisch? Ja, ein bisschen. Ich lerne noch.",trans:"您说英语吗？是的，一点点。我还在学习。"}
   ]},
  {id:'de-daily-2',lang:'de',theme:'daily',difficulty:'入门',title:'Einkaufen 购物',
   sentences:[
     {orig:"Entschuldigung, wie viel kostet dieses T-Shirt? Das kostet neunundzwanzig Euro.",trans:"打扰一下，这件T恤多少钱？29欧元。"},
     {orig:"Kann ich das anprobieren? Ja, natürlich. Die Umkleidekabine ist dort drüben.",trans:"我能试穿吗？当然。试衣间在那边。"},
     {orig:"Ich hätte gern einen Kaffee und ein Stück Kuchen, bitte.",trans:"我想要一杯咖啡和一块蛋糕。"},
     {orig:"Kann ich mit Karte bezahlen? Ja, wir akzeptieren alle gängigen Karten.",trans:"可以刷卡吗？是的，我们接受所有主流卡。"},
     {orig:"Ich schaue nur, danke. Kein Problem, nehmen Sie sich Zeit.",trans:"我只是看看，谢谢。没问题，您慢慢看。"},
     {orig:"Haben Sie das auch in einer anderen Größe? Ja, ich schaue mal nach.",trans:"这个有其他尺码吗？有的，我帮您查一下。"},
     {orig:"Könnten wir bitte die Rechnung haben? Ja, gleich bitte.",trans:"请给我们账单好吗？好的，请稍等。"},
     {orig:"Das ist zu teuer. Haben Sie etwas Günstigeres? Ja, hier bitte.",trans:"这太贵了。有便宜一些的吗？有的，请看这里。"}
   ]},
  {id:'de-daily-3',lang:'de',theme:'daily',difficulty:'入门',title:'Nach dem Weg fragen 问路',
   sentences:[
     {orig:"Entschuldigung, wie komme ich zum nächsten Bahnhof?",trans:"打扰一下，去最近的火车站怎么走？"},
     {orig:"Gehen Sie geradeaus und dann links. Sie können es nicht verfehlen.",trans:"直走然后左转。您一定能找到。"},
     {orig:"Ist es weit von hier? Nein, es ist nur etwa zehn Minuten zu Fuß.",trans:"离这里远吗？不远，步行大约十分钟。"},
     {orig:"Wo ist die nächste Bushaltestelle? Die ist gleich um die Ecke.",trans:"最近的公交站在哪里？就在拐角处。"},
     {orig:"Können Sie mir auf der Karte zeigen, wo wir sind? Ja, wir sind hier.",trans:"您能在地图上指给我看我们在哪里吗？可以，我们在这里。"},
     {orig:"Wie lange dauert es mit dem Taxi? Ungefähr fünfzehn Minuten.",trans:"坐出租车要多久？大约十五分钟。"},
     {orig:"Gibt es hier in der Nähe ein Restaurant? Ja, gleich dort drüben.",trans:"这附近有餐厅吗？有的，就在那边。"},
     {orig:"Ich habe mich verlaufen. Können Sie mir helfen? Natürlich, gerne!",trans:"我迷路了。您能帮我吗？当然可以！"}
   ]},
  {id:'de-daily-4',lang:'de',theme:'daily',difficulty:'入门',title:'Essen & Trinken 饮食',
   sentences:[
     {orig:"Was möchten Sie bestellen? Ich hätte gern die Suppe und ein Wasser.",trans:"您想点什么？我想要汤和一杯水。"},
     {orig:"Die Speisekarte, bitte. Hier ist die Speisekarte.",trans:"请给我菜单。这是菜单。"},
     {orig:"Das Essen schmeckt ausgezeichnet! Danke, das freut uns.",trans:"食物味道好极了！谢谢，我们很高兴。"},
     {orig:"Ich bin Vegetarier. Haben Sie vegetarische Gerichte? Ja, natürlich.",trans:"我是素食者。你们有素食菜吗？有的，当然有。"},
     {orig:"Zahlen, bitte! Zusammen oder getrennt? Zusammen, bitte.",trans:"请结账！一起付还是分开付？一起付。"},
     {orig:"Ich möchte einen Tisch für zwei Personen, bitte. Haben Sie reserviert?",trans:"我想订一张两人的桌子。您预约了吗？"},
     {orig:"Könnte ich noch ein Glas Wasser haben? Ja, sofort.",trans:"能再来一杯水吗？好的，马上。"}
   ]},
  {id:'de-work-1',lang:'de',theme:'business',difficulty:'入门',title:'Am Arbeitsplatz 职场',
   sentences:[
     {orig:"Guten Morgen zusammen! Wie war euer Wochenende? Danke, es war sehr schön.",trans:"大家早上好！你们周末怎么样？谢谢，很好。"},
     {orig:"Wir haben heute um zehn Uhr eine Besprechung im Konferenzraum.",trans:"我们今天十点在会议室有一个会议。"},
     {orig:"Könnten Sie mir bitte den Bericht schicken? Ja, ich schicke ihn Ihnen per E-Mail.",trans:"您能把报告发给我吗？好的，我通过邮件发给您。"},
     {orig:"Ich muss heute Überstunden machen. Das Projekt hat eine kurze Frist.",trans:"我今天必须加班。这个项目截止日期很近。"},
     {orig:"Haben Sie schon die neue Richtlinie gelesen? Nein, ich werde es heute tun.",trans:"您看过新的政策了吗？没有，我今天会看。"},
     {orig:"Die Genehmigung erfordert drei Unterschriften von Abteilungsleitern.",trans:"审批需要三个部门负责人的签字。"},
     {orig:"Könnten Sie das bitte beschleunigen? Der Termin rückt näher.",trans:"您能加快速度吗？截止日期越来越近了。"},
     {orig:"Ich empfehle, dass wir mehr Ressourcen für diese Aufgabe bereitstellen.",trans:"我建议我们为这个任务提供更多资源。"}
   ]},
  {id:'de-work-2',lang:'de',theme:'business',difficulty:'进阶',title:'Geschäfts-E-Mails 商务邮件',
   sentences:[
     {orig:"Sehr geehrter Herr Müller, ich beziehe mich auf unser Meeting vom letzten Dienstag.",trans:"尊敬的Müller先生，我指的是我们上周二的会议。"},
     {orig:"Vielen Dank für Ihre schnelle Antwort. Wir schätzen Ihre prompte Rückmeldung.",trans:"非常感谢您的迅速回复。我们感谢您的及时回应。"},
     {orig:"Im Anhang finden Sie den Quartalsbericht zur Durchsicht.",trans:"附件中是季度报告供您审阅。"},
     {orig:"Ich möchte einen Termin vereinbaren, um den Projektzeitplan zu besprechen.",trans:"我想约定一个时间来讨论项目计划。"},
     {orig:"Könnten Sie uns bitte ein Update zum aktuellen Stand des Vertrags geben?",trans:"您能给我们提供合同当前状态的更新吗？"},
     {orig:"Wir freuen uns auf Ihre baldige Rückmeldung.",trans:"我们期待您的尽快回复。"},
     {orig:"Bitte zögern Sie nicht, mich zu kontaktieren, falls Sie Fragen haben.",trans:"如果您有问题，请随时联系我。"}
   ]},
  {id:'de-culture-1',lang:'de',theme:'culture',difficulty:'进阶',title:'Deutsche Arbeitskultur 德国工作文化',
   sentences:[
     {orig:"In der deutschen Geschäftskultur ist Pünktlichkeit sehr wichtig.",trans:"在德国商务文化中，守时非常重要。"},
     {orig:"Deutsche Kollegen schätzen direkte und ehrliche Kommunikation.",trans:"德国同事看重直接和诚实的沟通。"},
     {orig:"Die Trennung zwischen Berufs- und Privatleben ist in Deutschland sehr ausgeprägt.",trans:"在德国，职业生活和个人生活的区分非常明显。"},
     {orig:"Man spricht sich am Arbeitsplatz normalerweise mit dem Nachnamen an.",trans:"在职场上通常用姓氏称呼对方。"},
     {orig:"Deutsche Unternehmen legen großen Wert auf Ordnung und Struktur.",trans:"德国企业非常重视秩序和结构。"},
     {orig:"Die Mittagspause ist in Deutschland meist zwischen zwölf und dreizehn Uhr.",trans:"在德国的午休时间通常在十二点到一点之间。"},
     {orig:"Fachkräfte werden in Deutschland sehr geschätzt und respektiert.",trans:"专业技术人员在美国非常受重视和尊重。"}
   ]},
  {id:'de-culture-2',lang:'de',theme:'culture',difficulty:'进阶',title:'Alltag in Deutschland 德国日常生活',
   sentences:[
     {orig:"Die Deutschen lieben Brot. Es gibt über dreihundert Brotsorten in Deutschland.",trans:"德国人热爱面包。德国有超过三百种面包。"},
     {orig:"In Deutschland trinkt man gerne Bier. Das Oktoberfest ist das größte Volksfest.",trans:"在德国人们喜欢喝啤酒。十月节是最大的民间节日。"},
     {orig:"Die Deutschen sind bekannt für ihre Liebe zum Wandern in der Natur.",trans:"德国人以热爱在大自然中徒步旅行而闻名。"},
     {orig:"Autobahn in Deutschland hat keine allgemeine Geschwindigkeitsbegrenzung.",trans:"德国的高速公路没有普遍的限速。"},
     {orig:"Weihnachten ist das wichtigste Fest in Deutschland. Man feiert es mit der Familie.",trans:"圣诞节是德国最重要的节日。人们和家人一起庆祝。"},
     {orig:"Deutsche Kinder gehen ab dem sechsten Lebensjahr zur Schule.",trans:"德国孩子从六岁开始上学。"}
   ]},
  {id:'de-exam-1',lang:'de',theme:'exam',difficulty:'入门',title:'Goethe A1 Vorbereitung 歌德A1备考',
   sentences:[
     {orig:"Ich wohne in einer Wohnung in der Stadtmitte. Die Miete ist nicht teuer.",trans:"我住在市中心的一套公寓里。房租不贵。"},
     {orig:"Mein Hobby ist Lesen. Ich lese gern Bücher und Zeitschriften.",trans:"我的爱好是阅读。我喜欢读书和杂志。"},
     {orig:"Am Wochenende gehe ich oft ins Kino oder treffe mich mit Freunden.",trans:"周末我经常去看电影或者和朋友见面。"},
     {orig:"Zum Frühstück esse ich normalerweise Brot mit Butter und trinke Kaffee.",trans:"早餐我通常吃黄油面包，喝咖啡。"},
     {orig:"Können Sie bitte langsam sprechen? Ich verstehe nicht so gut.",trans:"您能说慢一点吗？我不太理解。"},
     {orig:"Entschuldigung, wo ist die Toilette? Geradeaus und dann rechts.",trans:"打扰一下，洗手间在哪里？直走然后右转。"},
     {orig:"Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.",trans:"我学德语是因为我想在德国工作。"},
     {orig:"Das Wetter ist heute sehr schön. Die Sonne scheint und es ist warm.",trans:"今天天气很好。阳光明媚，很暖和。"}
   ]},
  {id:'de-exam-2',lang:'de',theme:'exam',difficulty:'入门',title:'Goethe A1 - Zahlen & Zeit 歌德A1 - 数字与时间',

function loadProgress(){
  try{
    const saved = localStorage.getItem('linguaflow_progress');
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed.en) state.progress.en = {...state.progress.en, ...parsed.en};
      if(parsed.de) state.progress.de = {...state.progress.de, ...parsed.de};
      if(parsed.dailyRecords) state.progress.dailyRecords = parsed.dailyRecords;
    }
  }catch(e){}
}
function saveProgress(){
  try{
    localStorage.setItem('linguaflow_progress', JSON.stringify(state.progress));
  }catch(e){}
}
function trackActivity(type, detail){
  const today = new Date().toISOString().split('T')[0];
  const now = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  state.progress.dailyRecords.push({date:today,time:now,type,detail});
  if(state.progress.dailyRecords.length > 500) state.progress.dailyRecords = state.progress.dailyRecords.slice(-500);
  saveProgress();
}
function markLessonComplete(matId){
  const lang = matId.split('-')[0];
  const p = state.progress[lang];
  if(p && !p.completedLessons.includes(matId)){
    p.completedLessons.push(matId);
    trackActivity('lesson', matId);
    saveProgress();
  } else {
    trackActivity('review', matId);
  }
}
function trackWordLookup(word, lang){
  const p = state.progress[lang];
  if(p && !p.wordsLookedUp.includes(word)){
    p.wordsLookedUp.push(word);
    saveProgress();
  }
}
function getRecommendations(lang){
  const p = state.progress[lang];
  const levels = DUO_LEVELS[lang] || [];
  const currentLevel = levels.find(l => l.id === p.duoLevel);
  const currentIdx = levels.findIndex(l => l.id === p.duoLevel);
  let recs = [];
  // Recommend next materials based on current level
  if(currentLevel){
    currentLevel.materials.forEach(mid => {
      const mat = MATERIALS.find(m => m.id === mid);
      if(mat && !p.completedLessons.includes(mid)){
        recs.push({material:mat, reason:'匹配当前进度'});
      }
    });
  }
  // Recommend materials from next level
  if(currentIdx >= 0 && currentIdx < levels.length - 1){
    const nextLevel = levels[currentIdx + 1];
    nextLevel.materials.forEach(mid => {
      const mat = MATERIALS.find(m => m.id === mid);
      if(mat && !p.completedLessons.includes(mid) && !recs.find(r=>r.material.id===mid)){
        recs.push({material:mat, reason:'下一步进阶内容'});
      }
    });
  }
  // If not enough recs, add uncompleted materials
  if(recs.length < 3){
    const allMats = MATERIALS.filter(m => m.lang === lang && !p.completedLessons.includes(m.id));
    allMats.forEach(mat => {
      if(!recs.find(r=>r.material.id===mat.id)){
        recs.push({material:mat, reason:'待学习'});
      }
    });
  }
  return recs.slice(0, 5);
}

// Google Translate TTS - natural human voice
// 主路径 translate.google.com 失败时自动改用 soundoftext(Google TTS 代理)；
// 全部失败则本次用浏览器语音播放，但保持用户的引擎选择（不会自动改回）
let _gMainDead = false;          // 主路径已确认不可达，跳过后续重试
const _gTtsCache = {};           // lang:text -> soundoftext 音频URL缓存
function gttsSoundOfText(text, lang){
  const ck = lang + ':' + text;
  if(_gTtsCache[ck]) return Promise.resolve(_gTtsCache[ck]);
  return fetch('https://api.soundoftext.com/sounds', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({engine: 'Google', data: {text, voice: lang}})
  }).then(r => r.json()).then(d => {
    if(!d || !d.success || !d.id) return null;
    return new Promise((resolve) => {
      let tries = 0;
      const poll = () => {
        tries++;
        fetch('https://api.soundoftext.com/sounds/' + d.id)
          .then(r => r.json())
          .then(j => {
            if(j.status === 'Done' && j.location){ _gTtsCache[ck] = j.location; resolve(j.location); }
            else if(j.status === 'Error' || j.status === 'Fail' || tries > 15){ resolve(null); }
            else setTimeout(poll, 1200);
          })
          .catch(() => { if(tries > 15) resolve(null); else setTimeout(poll, 1200); });
      };
      poll();
    });
  }).catch(() => null);
}
function googleTTS(text, onEnd){
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  const lang = state.lang === 'en' ? 'en-US' : 'de-DE';
  const gLang = state.lang === 'en' ? 'en' : 'de';
  const chunks = splitTextForTTS(text, 180);
  let idx = 0;
  function playChunk(){
    if(idx >= chunks.length){ if(onEnd) onEnd(); return; }
    const chunk = chunks[idx];
    if(_gMainDead){
      soPlay(chunk);
    } else {
      googlePlay(chunk);
    }
  }
  // 主路径：translate.google.com（部分网络可达，音质最佳）
  function googlePlay(chunk){
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${gLang}&client=tw-ob&q=${encodeURIComponent(chunk)}`;
    const audio = new Audio(url);
    let done = false;
    const timer = setTimeout(() => { if(!done){ done = true; try{audio.pause();}catch(e){} soPlay(chunk); } }, 5000);
    audio.playbackRate = state.speed;
    currentAudio = audio;
    audio.onended = () => { if(done) return; done = true; clearTimeout(timer); idx++; playChunk(); };
    audio.onerror = () => { if(done) return; done = true; clearTimeout(timer); _gMainDead = true; soPlay(chunk); };
    audio.play().catch(() => { if(done) return; done = true; clearTimeout(timer); _gMainDead = true; soPlay(chunk); });
  }
  // 兜底：soundoftext(Google TTS 代理)
  function soPlay(chunk){
    gttsSoundOfText(chunk, lang).then(url => {
      if(!url){
        // 全部失败：本次临时用浏览器语音，不改变用户选择的引擎
        console.warn('Google TTS 不可用，本次播放使用浏览器语音');
        browserTTS(chunk, () => { idx++; playChunk(); });
        return;
      }
      const audio = new Audio(url);
      audio.playbackRate = state.speed;
      currentAudio = audio;
      audio.onended = () => { idx++; playChunk(); };
      audio.onerror = () => { browserTTS(chunk, () => { idx++; playChunk(); }); };
      audio.play().catch(() => { browserTTS(chunk, () => { idx++; playChunk(); }); });
    });
  }
  playChunk();
}
function splitTextForTTS(text, maxLen){
  if(text.length <= maxLen) return [text];
  const chunks = [];
  let remaining = text;
  while(remaining.length > 0){
    if(remaining.length <= maxLen){ chunks.push(remaining); break; }
    let splitAt = remaining.lastIndexOf('. ', maxLen);
    if(splitAt < maxLen * 0.3) splitAt = remaining.lastIndexOf(', ', maxLen);
    if(splitAt < maxLen * 0.3) splitAt = remaining.lastIndexOf(' ', maxLen);
    if(splitAt < 0) splitAt = maxLen;
    chunks.push(remaining.substring(0, splitAt + 1));
    remaining = remaining.substring(splitAt + 1);
  }
  return chunks;
}
// Browser SpeechSynthesis - fallback
function browserTTS(text, onEnd){
  synth.cancel();
  // iOS Safari/PWA 首次 speak 可能无声：先播一个空句预热
  if(!window.__ttsWarmed){
    window.__ttsWarmed = true;
    try{
      const warm = new SpeechSynthesisUtterance(' ');
      warm.volume = 0;
      synth.speak(warm);
      synth.cancel();
    }catch(e){}
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.lang === 'en' ? 'en-US' : 'de-DE';
  u.rate = state.speed;
  u.pitch = 1;
  if(onEnd) u.onend = onEnd;
  synth.speak(u);
  return u;
}
// Unified speak function
function speak(text, onEnd, onBoundary){
  stopAudio();
  if(ttsEngine === 'google'){
    googleTTS(text, onEnd);
  } else {
    browserTTS(text, onEnd);
  }
}
function stopAudio(){
  if(currentAudio){ try{ currentAudio.pause(); currentAudio.onended=null; }catch(e){} currentAudio=null; }
}
function speakSentenceBySentence(sentences, containerId, startIdx=0){
  stopAudio();
  synth.cancel();
  state.isPlaying = true;
  state.currentSentenceIdx = startIdx;
  function speakNext(idx){
    if(idx >= sentences.length || !state.isPlaying){
      state.isPlaying = false;
      state.currentSentenceIdx = -1;
      highlightSentence(containerId, -1);
      updatePlayBtn();
      return;
    }
    state.currentSentenceIdx = idx;
    highlightSentence(containerId, idx);
    speak(sentences[idx].orig, ()=> speakNext(idx+1));
  }
  speakNext(startIdx);
  updatePlayBtn();
}
function stopSpeaking(){
  try { if(synth) synth.cancel(); } catch(e){}
  stopAudio();
  state.isPlaying = false;
  state.currentSentenceIdx = -1;
  updatePlayBtn();
}
function highlightSentence(containerId, idx){
  document.querySelectorAll(`#${containerId} .bilingual-block`).forEach((el,i)=>{
    el.classList.toggle('playing', i===idx);
    if(i===idx) el.scrollIntoView({behavior:'smooth',block:'nearest'});

  document.querySelectorAll('.play-toggle').forEach(btn=>{
    btn.textContent = state.isPlaying ? '⏸ 暂停' : '▶ 播放';

  stopSpeaking();
  state.isPlaying = true;
  updatePlayBtn();
  const sentences = state.currentMaterial.sentences;
  let idx = 0;
  function loopSentence(i){
    if(!state.isPlaying || i >= sentences.length){
      state.isPlaying = false;
      state.currentSentenceIdx = -1;
      highlightSentence('speakContent', -1);
      updatePlayBtn();
      return;
    }
    state.currentSentenceIdx = i;
    highlightSentence('speakContent', i);
    // Play 3 times with pauses
    let count = 0;
    function playOnce(){
      if(count >= 3 || !state.isPlaying){ loopSentence(i+1); return; }
      count++;
      speak(sentences[i].orig, ()=> setTimeout(playOnce, 800/state.speed));
    }
    playOnce();
  }
  loopSentence(0);
}
// Recording
let mediaRecorder = null;
let audioChunks = [];
let audioUrl = null;
async function toggleRecord(){
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  if(state.isRecording){
    mediaRecorder.stop();
    state.isRecording = false;
    btn.textContent = '🎤 开始录音';
    btn.classList.remove('btn-danger');
    btn.classList.add('btn-success');
    status.innerHTML = '✅ 录音完成 <button class="btn btn-sm" onclick="playRecord()">▶ 回放</button>';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      audioUrl = URL.createObjectURL(new Blob(audioChunks,{type:'audio/webm'}));
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    state.isRecording = true;
    btn.textContent = '⏹ 停止录音';
    btn.classList.remove('btn-success');
    btn.classList.add('btn-danger');
    status.innerHTML = '<span class="recording-indicator"><span class="recording-dot"></span>录音中...</span>';
  }catch(e){
    status.textContent = '❌ 无法访问麦克风，请检查权限设置';
  }
}
function playRecord(){
  if(audioUrl){
    const a = new Audio(audioUrl);
    a.play();
  }
}

let _dailyCache = {};
let _dailyTab = 'articles'; // articles | vocab | sentences | quiz

async function loadDailyContent(lang){
  const now = new Date();
  const cacheKey = `${lang}_${now.toDateString()}`;
  if(_dailyCache[cacheKey]) return _dailyCache[cacheKey];
  const bust = `?_=${now.getTime()}`;
  const url = `daily_content_${lang}.json${bust}`;
  try {
    const resp = await fetch(url);
    if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    // 合并每日内容词汇表到运行时词典（点词查询可命中）
    if(data.vocabulary && Array.isArray(data.vocabulary)){
      const rt = _runtimeDict[lang] = _runtimeDict[lang] || {};
      data.vocabulary.forEach(v => {
        if(v && v.word && v.meaning){
          const w = String(v.word).trim().toLowerCase();
          if(w) rt[w] = v.meaning;
        }
      });
    }
    _dailyCache[cacheKey] = data;
    return data;
  } catch(e){
    console.warn('Failed to load daily content:', e);
    return null;
  }
}

function renderDaily(){

function renderDailyContent(data, lang){
  const area = document.getElementById('contentArea');
  const dateStr = data.date || new Date().toISOString().slice(0,10);
  const langLabel = lang === 'en' ? '英语' : '德语';
  const themeLabels = {news:'新闻英语', work:'工作/日常英语', daily_news:'新闻英语', basic:'基础德语', daily:'日常场景'};
  const themeLabel = themeLabels[data.theme] || data.theme || 'daily';

  // Tab bar
  const tabs = [
    {key:'articles', icon:'📰', label:'文章'},
    {key:'vocab', icon:'📚', label:'词汇'},
    {key:'sentences', icon:'💬', label:'句子'},
    {key:'quiz', icon:'🧠', label:'理解测试'}
  ];
  const tabBar = `<div class="daily-tab-bar">${tabs.map(t =>
    `<div class="daily-tab${_dailyTab===t.key?' active':''}" onclick="_dailyTab='${t.key}';_renderDailyFromCache()">${t.icon} ${t.label}</div>`
  ).join('')}</div>`;

  let content = '';
  if(_dailyTab === 'articles') content = renderDailyArticles(data, lang);
  else if(_dailyTab === 'vocab') content = renderDailyVocab(data, lang);
  else if(_dailyTab === 'sentences') content = renderDailySentences(data, lang);
  else if(_dailyTab === 'quiz') content = renderDailyQuiz(data, lang);

  area.innerHTML = `<div class="fade-in">
    <div class="daily-header">
      <div class="daily-date">📅 ${dateStr} · ${langLabel}每日内容</div>
      <div style="font-size:12px;color:var(--text-secondary)">${themeLabel}</div>
    </div>
    ${tabBar}
    ${content}
  </div>`;
}

function _renderDailyFromCache(){
  const lang = state.lang;
  const cacheKey = `${lang}_${new Date().toDateString()}`;
  const data = _dailyCache[cacheKey];
  if(data) renderDailyContent(data, lang);
  else renderDaily();
}

function renderDailyQuiz(data, lang){
  const questions = data.questions || [];
  if(!questions.length) return '<div class="daily-error">暂无测试题</div>';
  return `<div class="daily-section">
    <div class="daily-section-title">🧠 理解测试 (${questions.length}题)</div>

function checkDailyAnswer(qi, oi, correct){
  const qDiv = document.getElementById(`dq-${qi}`);
  if(!qDiv) return;
  const options = qDiv.querySelectorAll('.daily-option');
  // Prevent re-answering
  if(qDiv.dataset.answered) return;
  qDiv.dataset.answered = '1';
  options.forEach((o, i) => {
    if(i === correct) o.classList.add('correct');
    else if(i === oi && oi !== correct) o.classList.add('wrong');
  });
}

function renderQuizQuestion(){
  const m = state.currentMaterial;
  if(!m) return;
  const idx = window._quizIdx || 0;
  if(idx >= m.sentences.length){
    // Quiz complete
    const score = window._quizScore || 0;

    const pct = Math.round(score/total*100);

    trackActivity('quiz', `${m.title} (${score}/${total})`);
    document.getElementById('contentArea').innerHTML = `<div class="card fade-in" style="max-width:500px;margin:40px auto;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>
      <div style="font-size:24px;font-weight:700;margin-bottom:8px">听写完成！</div>
      <div style="font-size:18px;color:var(--text-secondary)">得分：${score} / ${total}（${pct}%）</div>
      <div style="margin-top:20px" class="btn-group" style="justify-content:center">
        <button class="btn btn-primary" onclick="selectForQuiz('${m.id}')">🔄 再来一次</button>
        <button class="btn" onclick="switchModule('listening')">返回</button>
      </div></div>`;
    return;
  }
  const s = m.sentences[idx];
  const panel = document.getElementById('contentArea');
  panel.innerHTML = `<div class="card fade-in" style="max-width:600px;margin:20px auto">
    <div class="card-header">
      <div class="card-title">听写测试 (${idx+1}/${m.sentences.length})</div>
      <div style="font-size:13px;color:var(--text-secondary)">得分：${window._quizScore||0}</div>
    </div>
    <div style="text-align:center;margin:20px 0">
      <button class="btn btn-primary btn-icon" style="width:60px;height:60px;font-size:24px" onclick="playQuizAudio()">🔊</button>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:8px">点击播放音频，然后输入你听到的内容</div>
    </div>
    <input type="text" class="quiz-input" id="quizInput" placeholder="输入你听到的内容..." onkeydown="if(event.key==='Enter')checkQuizAnswer()">
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div style="margin-top:12px" class="btn-group">
      <button class="btn btn-primary" onclick="checkQuizAnswer()">✅ 检查</button>
      <button class="btn" onclick="showQuizHint()">💡 提示</button>
      <button class="btn" onclick="nextQuizQuestion()">⏭️ 跳过</button>
    </div>
    <div id="quizHint" style="margin-top:12px;font-size:14px;color:var(--text-secondary);display:none"></div>
  </div>`;
}
function playQuizAudio(){
  if(!state.currentMaterial) return;
  const idx = window._quizIdx || 0;
  speak(state.currentMaterial.sentences[idx].orig);
}
function checkQuizAnswer(){
  const input = document.getElementById('quizInput');
  const fb = document.getElementById('quizFeedback');
  if(!input || !input.value.trim()) return;
  const m = state.currentMaterial;
  const idx = window._quizIdx || 0;
  const correct = m.sentences[idx].orig.toLowerCase().trim();
  const answer = input.value.trim().toLowerCase();
  // Simple similarity check
  const correctWords = correct.split(/\s+/);
  const answerWords = answer.split(/\s+/);
  let matches = 0;
  correctWords.forEach(w => {
    if(answerWords.some(aw => aw === w || (aw.length > 3 && w.includes(aw)))) matches++;
  });
  const ratio = matches / correctWords.length;
  if(ratio >= 0.7){
    input.classList.add('correct');
    input.classList.remove('wrong');
    fb.className = 'quiz-feedback show correct';
    fb.innerHTML = `✅ 正确！原文：<strong>${m.sentences[idx].orig}</strong><br>${m.sentences[idx].trans}`;
    window._quizScore = (window._quizScore||0) + 1;
  } else {
    input.classList.add('wrong');
    input.classList.remove('correct');
    fb.className = 'quiz-feedback show wrong';
    fb.innerHTML = `❌ 不太对。原文：<strong>${m.sentences[idx].orig}</strong><br>${m.sentences[idx].trans}`;
  }
  setTimeout(()=>{ window._quizIdx = idx + 1; renderQuizQuestion(); }, 2500);
}
function showQuizHint(){
  const m = state.currentMaterial;
  const idx = window._quizIdx || 0;
  const s = m.sentences[idx].orig;
  const words = s.split(/\s+/);
  const hint = words.map((w,i)=> i < Math.ceil(words.length*0.3) ? w : '___').join(' ');
  const el = document.getElementById('quizHint');
  el.style.display = 'block';
  el.innerHTML = `💡 提示：${hint}...`;
}
function nextQuizQuestion(){
  window._quizIdx = (window._quizIdx||0) + 1;
  renderQuizQuestion();
}

}</pre>

         ondragover="event.preventDefault();this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="handleImportDrop(event)">
      <div style="font-size:36px;margin-bottom:8px">📄</div>
      <div>点击或拖拽 JSON 文件到此处</div>
      <div style="font-size:12px;margin-top:4px">支持 .json 格式</div>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImportFile(event)">
    <div id="importResult" style="margin-top:16px"></div>
    ${state.customMaterials.length > 0 ? `
    <div style="margin-top:20px">
      <div class="card-title" style="margin-bottom:10px">已导入素材 (${state.customMaterials.length})</div>
      ${state.customMaterials.map(m=>`<div class="material-card"><div><div class="mc-title">${m.title}</div><div class="mc-meta">${m.lang==='en'?'英语':'德语'} · ${m.sentences.length}句</div></div><button class="btn btn-sm" onclick="removeCustom('${m.id}')">删除</button></div>`).join('')}
    </div>` : ''}
  </div>`;
}
function handleImportDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if(file) processImportFile(file);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(file) processImportFile(file);
}
function processImportFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.lang || !data.title || !data.sentences || !Array.isArray(data.sentences)){
        throw new Error('格式不正确');
      }
      const material = {
        id: 'custom-' + Date.now(),
        lang: data.lang,
        theme: data.theme || 'daily',
        difficulty: data.difficulty || '自定义',
        title: data.title,
        sentences: data.sentences.map(s => ({orig: s.orig, trans: s.trans}))
      };
      state.customMaterials.push(material);
      document.getElementById('importResult').innerHTML = `<div style="color:var(--success);font-size:14px">✅ 成功导入「${material.title}」(${material.sentences.length}句)</div>`;
      setTimeout(()=> renderImport(), 1500);
    }catch(err){
      document.getElementById('importResult').innerHTML = `<div style="color:var(--danger);font-size:14px">❌ 导入失败：${err.message}</div>`;
    }
  };
  reader.readAsText(file);
}
function removeCustom(id){
  state.customMaterials = state.customMaterials.filter(m=>m.id!==id);
  renderImport();
}

function setDuoLevel(levelId){
  const lang = state.lang;
  state.progress[lang].duoLevel = levelId;
  saveProgress();
  trackActivity('sync', `${lang==='en'?'英语':'德语'}多邻国→${levelId}`);
  renderProgress();
}
function setTargetLevel(targetId){
  const lang = state.lang;
  const targets = lang === 'en' ? EN_TARGETS : DE_TARGETS;
  const t = targets.find(t => t.id === targetId);
  state.progress[lang].targetLevel = targetId;
  state.progress[lang].targetLabel = t ? t.label : targetId;
  saveProgress();
  renderProgress();
}
function selectMaterialFromProgress(matId){
  const mat = findMaterial(matId);
  if(!mat) return;
  state.currentMaterial = mat;
  state.lang = mat.lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === mat.lang));
  populateVoiceSelect();
  switchModule('listening');
}
function getStreakCount(){
  const records = state.progress.dailyRecords;
  if(records.length === 0) return 0;
  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if(dates[0] !== today && dates[0] !== yesterday) return 0;
  let streak = 1;
  for(let i = 0; i < dates.length - 1; i++){
    const d1 = new Date(dates[i]);
    const d2 = new Date(dates[i+1]);
    const diff = (d1 - d2) / 86400000;
    if(diff === 1) streak++;
    else break;
  }
  return streak;
}

function renderActivity(){
  const area = document.getElementById('contentArea');
  const records = state.progress.dailyRecords;
  const typeLabels = {listening:'听力训练',speaking:'口语跟读',reading:'阅读查词',grammar:'语法学习',quiz:'听写测试',lesson:'完成课程',review:'复习课程',sync:'进度同步',word:'查词',import:'导入素材'};
  const typeIcons = {listening:'🎧',speaking:'🗣️',reading:'📖',grammar:'📐',quiz:'📝',lesson:'✅',review:'🔄',sync:'🦎',word:'📖',import:'📂'};

  // Group by date
  const grouped = {};
  records.slice().reverse().forEach(r => {
    if(!grouped[r.date]) grouped[r.date] = [];
    grouped[r.date].push(r);
  });
  const dates = Object.keys(grouped).sort().reverse();

  // Stats
  const today = new Date().toISOString().split('T')[0];
  const todayRecords = records.filter(r => r.date === today);
  const totalDays = new Set(records.map(r => r.date)).size;
  const totalWords = state.progress.en.wordsLookedUp.length + state.progress.de.wordsLookedUp.length;
  const totalLessons = state.progress.en.completedLessons.length + state.progress.de.completedLessons.length;

  let activityHtml = '';
  if(dates.length === 0){
    activityHtml = '<div class="empty-state"><div class="es-icon">📅</div><div class="es-text">暂无学习记录<br>开始学习后记录将自动出现在这里</div></div>';
  } else {
    dates.slice(0, 14).forEach(date => {
      const items = grouped[date];
      const dateLabel = date === today ? '今天' : date === new Date(Date.now()-86400000).toISOString().split('T')[0] ? '昨天' : date;
      activityHtml += `<div class="activity-day">
        <div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text)">${dateLabel} <span style="font-weight:400;color:var(--text-secondary)">(${items.length}条记录)</span></div>
        ${items.slice().reverse().map(r => `<div class="activity-item">
          <span>${typeIcons[r.type]||'📌'}</span>
          <span style="flex:1">${typeLabels[r.type]||r.type}${r.detail ? ' · ' + (findMaterial(r.detail)?.title || r.detail) : ''}</span>
          <span style="color:var(--text-secondary);font-size:12px">${r.time}</span>
        </div>`).join('')}
      </div>`;
    });
  }

  area.innerHTML = `<div class="fade-in" style="max-width:700px;margin:0 auto">
    <!-- Summary Stats -->
    <div class="grid-3" style="margin-bottom:16px">
      <div class="card stat-card">
        <div style="font-size:28px;font-weight:700;color:var(--primary)">${totalDays}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">学习天数</div>
      </div>
      <div class="card stat-card">
        <div style="font-size:28px;font-weight:700;color:var(--success)">${totalLessons}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">完成课程</div>
      </div>
      <div class="card stat-card">
        <div style="font-size:28px;font-weight:700;color:var(--warning)">${totalWords}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">查阅单词</div>
      </div>
    </div>
    <!-- Activity Log -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📅 学习记录</div>
        ${records.length > 0 ? `<button class="btn btn-sm btn-danger" onclick="clearActivityLog()">清空记录</button>` : ''}
      </div>
      ${activityHtml}
    </div>
  </div>`;
}

function clearActivityLog(){
  if(confirm('确定要清空所有学习记录吗？此操作不可撤销。')){
    state.progress.dailyRecords = [];
    saveProgress();
    renderActivity();
  }
}

let queryResults = {dict:null, grammar:[], rawText:''};

function renderQuery(){
  const area = document.getElementById('contentArea');
  area.innerHTML = `<div class="fade-in" style="max-width:750px;margin:0 auto">
    <div class="card">
      <div class="card-header"><div class="card-title">🔍 AI 智能查询</div></div>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">输入单词、短语或句子，系统将自动识别并提供词典释义和语法分析。支持德语和英语。</p>
      <div class="query-box">
        <input type="text" class="query-input" id="queryInput" placeholder="输入要查询的单词、短语或句子..." onkeydown="if(event.key==='Enter')doQuery()">
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="doQuery()">🔍 查询</button>
          <button class="btn" onclick="document.getElementById('queryInput').value='';clearQuery()">清空</button>
        </div>
      </div>
      <div id="queryResults"></div>
    </div>
  </div>`;
  document.getElementById('queryInput').focus();
}

function clearQuery(){
  queryResults = {dict:null, grammar:[], rawText:''};
  document.getElementById('queryResults').innerHTML = '';
}

function doQuery(){
  const input = document.getElementById('queryInput');
  if(!input || !input.value.trim()) return;
  const text = input.value.trim();
  queryResults.rawText = text;
  const container = document.getElementById('queryResults');
  container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary)"><div class="loading-spinner"></div>查询中...</div>';

  // Determine query type
  const words = text.split(/\s+/);
  const isSingleWord = words.length === 1;

  // 1. Dictionary lookup
  let dictResult = null;
  if(isSingleWord){
    dictResult = lookupWordOnline(text.toLowerCase());
  }

  // 2. Grammar analysis (for phrases and sentences)
  let grammarHits = [];
  if(words.length >= 1){
    grammarHits = analyzeGrammar(text);
  }

  queryResults.dict = dictResult;
  queryResults.grammar = grammarHits;

  // Render results
  let html = '<div class="query-result">';

  // Dictionary result
  if(isSingleWord && dictResult){
    html += `<div class="dict-result">
      <div class="dr-word">${dictResult.word}</div>
      ${dictResult.phonetic ? `<div class="dr-phonetic">${dictResult.phonetic}</div>` : ''}
      <div class="dr-meaning"><span class="pos">${dictResult.lang==='en'?'英':'德'}</span> ${dictResult.meaning}</div>
      ${dictResult.extra ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">${dictResult.extra}</div>` : ''}
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="speakQueryWord('${dictResult.word.replace(/'/g,"\\'")}')">🔊 发音</button>
        <button class="btn btn-sm btn-primary" onclick="addToNote('word',decodeURIComponent('${enc(dictResult.word)}'),decodeURIComponent('${enc(dictResult.meaning)}'))">📒 加入笔记</button>
      </div>
    </div>`;
  } else if(isSingleWord && !dictResult){
    html += `<div class="dict-result">
      <div class="dr-word">${text}</div>
      <div class="dr-meaning" style="color:var(--text-secondary)">本地词典未收录，试试查询短语或句子获取语法分析。</div>
      <div style="margin-top:10px">
        <button class="btn btn-sm" onclick="speakQueryWord('${text.replace(/'/g,"\\'")}')">🔊 发音</button>
      </div>
    </div>`;
  }

  // Grammar analysis results
  if(grammarHits.length > 0){
    html += `<div style="margin-top:16px"><div style="font-weight:600;font-size:14px;margin-bottom:10px">📐 相关语法点（${grammarHits.length}个）</div>`;
    grammarHits.forEach(g => {
      html += `<div class="grammar-card" onclick="toggleGrammarDetail('${g.id}')">
        <div class="gc-title">${g.title}</div>
        <div class="gc-preview">${g.content.substring(0,60)}...</div>
        <div id="gd-${g.id}" style="display:none" class="grammar-detail">
          <div class="gd-title">${g.title}</div>
          <div class="gd-content">${g.content}</div>
          ${g.examples ? `<div class="gd-example">📝 ${g.examples}</div>` : ''}
          <div style="margin-top:10px">
            <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();addToNote('grammar',decodeURIComponent('${enc(g.title)}'),decodeURIComponent('${enc(g.content.substring(0,120))}'))">📒 加入笔记</button>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  } else if(!isSingleWord){
    html += `<div style="margin-top:16px;padding:16px;background:var(--highlight);border-radius:var(--radius-sm);text-align:center;color:var(--text-secondary)">
      <div style="font-size:14px">未找到直接相关的语法点</div>
      <div style="font-size:12px;margin-top:4px">试试输入包含动词、介词或语法关键词的句子</div>
    </div>`;
  }

  // Add to note button for full sentence
  if(words.length > 1){
    html += `<div style="margin-top:16px;padding:14px;background:var(--highlight-sentence);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:13px;color:var(--text-secondary)">将查询内容保存为常用句</div>
      <button class="btn btn-sm btn-primary" onclick="addToNote('phrase',decodeURIComponent('${enc(text)}'),'')">📒 加入常用句笔记</button>
    </div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

// 安全内联编码：文本经 URI 编码嵌入 onclick，避免换行/引号破坏 HTML 属性与 JS 字符串
function enc(s){
  return encodeURIComponent(String(s == null ? '' : s)).replace(/'/g,'%27');
}

// ========== 在线词典内容（面板内联，免跳转） ==========
const _dictCache = {};
function stripWikitext(t){
  return String(t).replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g,'$1')
    .replace(/\{\{[^}]*\}\}/g,'').replace(/'''/g,'').replace(/''/g,'')
    .replace(/<ref[\s\S]*?<\/ref>/gi,'').replace(/\[[^\]]*\]/g,'').trim();
}
function parseWiktionary(wikitext){
  const w = String(wikitext);
  const secM = w.match(/==\s*德语\s*==/);
  if(!secM) return null;
  const i = secM.index;
  const endM = w.slice(i + secM[0].length).match(/\n==(?!=)/);
  const end = endM ? i + secM[0].length + endM.index : w.length;
  const sec = w.slice(i, end);
  const posMap = {'-noun-':'名词','-adj-':'形容词','-verb-':'动词','-adv-':'副词','-pron-':'代词','-prep-':'介词','-conj-':'连词','-interj-':'感叹词','-num-':'数词','-phrase-':'短语'};
  let pos = '';
  for(const k in posMap){ if(sec.includes('{{'+k)){ pos = posMap[k]; break; } }
  const g2 = sec.match(/'''[^']*'''\s*([mnf])\./);
  const g3 = sec.match(/\{\{de-noun\|([mnf])\|/);
  const gender = g2 ? g2[1] : (g3 ? g3[1] : '');
  const defs = [...sec.matchAll(/^#\s*([^#].*)$/gm)].map(m => stripWikitext(m[1])).filter(d => d && d.length > 1 && !d.startsWith('{{') && !d.includes('*'));
  return defs.length ? {pos, gender, defs} : null;
}

// 有道词典建议(JSONP)：script标签加载，绕过CORS限制；用于德语在线释义
function youdaoSuggest(word, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = '_ydCb' + Date.now() + Math.floor(Math.random() * 1000);
    const url = 'https://dict.youdao.com/suggest?num=6&ver=3.0&doctype=json&cache=false&le=de&q=' + encodeURIComponent(word) + '&callback=' + cbName;
    let done = false;
    const cleanup = () => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      delete window[cbName];
      const s = document.getElementById('ydScript' + cbName);
      if(s && s.parentNode) s.parentNode.removeChild(s);
    };
    const timer = setTimeout(() => { cleanup(); reject(new Error('youdao timeout')); }, timeoutMs || 6000);
    window[cbName] = (data) => { cleanup(); resolve(data || null); };
    const s = document.createElement('script');
    s.id = 'ydScript' + cbName;
    s.src = url;
    s.onerror = () => { cleanup(); reject(new Error('youdao load error')); };
    document.head.appendChild(s);
  });
}

// 清洗有道 explain：只保留中文释义段与词性标记，剔除页面按钮噪音
function cleanYdExplain(ex){
  if(!ex) return '';
  const posRe = /^(n|f|m|adj|adv|Vt|Vi|V|vt|vi|pron|prep|num|konj|art|interj|int|ger|pp|pt|part)$/i;
  const noiseRe = /^(赞|踩|更换|举报|好评|差评|收藏|翻译|复制|纠错|分享|导出|打印)$/;
  const parts = String(ex).split(/[;；]/).map(s => s.trim()).filter(s => s && s.length < 60);
  const kept = parts.filter(s => ( /[\u4e00-\u9fff]/.test(s) || posRe.test(s) ) && !noiseRe.test(s));
  return kept.slice(0, 4).join('；');
}

async function fetchOnlineDict(word, lang){
  const key = lang + ':' + word;
  if(_dictCache[key]) return _dictCache[key];
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try{
    if(lang === 'en'){
      const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word), {signal: ctrl.signal});
      if(!r.ok) return null;
      const d = await r.json();
      const phon = d[0].phonetic || (d[0].phonetics || []).map(p => p.text).find(Boolean) || '';
      const meanings = (d[0].meanings || []).slice(0, 4).map(m => ({
        pos: m.partOfSpeech,
        defs: (m.definitions || []).slice(0, 3).map(x => ({text: x.definition || '', ex: x.example || ''}))
      })).filter(m => m.defs.length);
      const out = {source:'dictionaryapi', word: d[0].word, phonetic: phon, meanings};
      _dictCache[key] = out;
      return out;
    }
    // 德语：优先 有道词典建议(JSONP)，失败或无结果降级 MyMemory 翻译
    try{
      const yd = await youdaoSuggest(word);
      const entries = (yd && yd.data && yd.data.entries) || [];
      if(entries.length){
        const mainDef = cleanYdExplain(entries[0].explain);
        if(mainDef){
          const related = entries.slice(1, 4).map(e => ({word: e.entry, def: cleanYdExplain(e.explain).split('；')[0]})).filter(r => r.def && r.word !== word);
          const out = {source:'youdao', word, defs: [mainDef], related};
          _dictCache[key] = out;
          return out;
        }
      }
    }catch(e){}
    // 降级：MyMemory 机器翻译（须用独立 AbortController，原信号已超时中止）
    const ctrl2 = new AbortController();
    const timer2 = setTimeout(() => ctrl2.abort(), 6000);
    try{
      const t = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=de|zh-CN', {signal: ctrl2.signal});
      if(t.ok){
        const j = await t.json();
        const text = j.responseData && j.responseData.translatedText;
        if(text){
          const out = {source:'mymemory', word, defs: [stripWikitext(text)]};
          _dictCache[key] = out;
          return out;
        }
      }
    }catch(e2){
      return null;
    }finally{
      clearTimeout(timer2);
    }
    return null;
  }catch(e){
    return null;
  }finally{
    clearTimeout(timer);
  }
}

function lookupWordOnline(word){
  word = word.toLowerCase().replace(/[^a-zäöüßéèêña-z]/gi,'');
  if(!word || word.length < 2) return null;
  // Check local dictionary first (static + extra + runtime daily vocab)
  const localDict = Object.assign({}, DICTIONARY[state.lang] || {}, DICTIONARY_EXTRA[state.lang] || {}, _runtimeDict[state.lang] || {});
  if(localDict[word]){
    return {word, meaning: localDict[word], lang: state.lang, phonetic:'', extra:''};
  }
  // Check reverse dictionary (Chinese → target)
  const otherLang = state.lang === 'en' ? 'de' : 'en';
  const reverseDict = DICTIONARY[otherLang] || {};
  for(const [k,v] of Object.entries(reverseDict)){
    if(v.includes(word)){
      return {word:k, meaning:`${word} 的相关词`, lang:otherLang, phonetic:'', extra:`在${otherLang==='en'?'英':'德'}语词典中找到`};
    }
  }
  // Check other language dictionary
  const otherDict = DICTIONARY[otherLang] || {};
  if(otherDict[word]){
    return {word, meaning: otherDict[word], lang: otherLang, phonetic:'', extra:''};
  }
  return null;
}

function analyzeGrammar(text){
  const lower = text.toLowerCase();
  const words = lower.split(/\s+/);
  const isEn = state.lang === 'en';
  const refs = isEn ? EN_GRAMMAR_REF : GRAMMAR_REF;
  let hits = [];
  let hitIds = new Set();

  // Keyword matching（拉丁关键词用词边界匹配，避免子串误命中如 would 里的 wo）
  refs.forEach(g => {
    let score = 0;
    g.keywords.forEach(kw => {
      const kwLower = kw.toLowerCase();
      if(words.includes(kwLower)) score += 3;
      else if(/^[a-z]+(?:[ -][a-z]+)*$/.test(kwLower) && new RegExp('\\b' + kwLower.replace(/\s+/g,'\\s+') + '\\b').test(lower)) score += 1;
      else if(/[\u4e00-\u9fa5]/.test(kwLower) && lower.includes(kwLower)) score += 1;
    });
    if(score > 0 && !hitIds.has(g.id)){
      hits.push({...g, score});
      hitIds.add(g.id);
    }
  });

  // Pattern-based detection（按语言选择模式库）
  const deVerbPatterns = [
    {pattern:/\b(ich bin|du bist|er ist|wir sind|ihr seid|sie sind)\b/i, id:'verb-conj'},
    {pattern:/\b(ich habe|du hast|er hat|wir haben)\b/i, id:'verb-conj'},
    {pattern:/\b(ich kann|du kannst|er kann|ich muss|du musst|ich will|du willst|ich möchte|du möchtest|ich darf|ich soll)\b/i, id:'modal-verbs'},
    {pattern:/\b(gegangen|gekommen|gefahren|aufgestanden|gemacht|gelesen|geschrieben|gegessen|getrunken|genommen|gegeben|gesprochen|gefunden|gedacht|gewesen|geworden)\b/i, id:'perfect'},
    {pattern:/\b(stehe.*auf|rufe.*an|kaufe.*ein|sehe.*fern|mache.*auf|mache.*zu|komme.*mit|gehe.*zurück)\b/i, id:'separable'},
    {pattern:/\b(mich|dich|sich|uns|euch)\b.*\b(wasche|freue|treffe|setze|stelle|wünsche)\b|\b(wasche|freue|treffe|setze|stelle|wünsche)\b.*\b(mich|dich|sich|uns|euch)\b/i, id:'reflexive'},
    {pattern:/\b(weil|dass|wenn|obwohl|seit|als ob)\b/i, id:'conjunctions'},
    {pattern:/\b(als|am .+sten|-er als)\b|\b\w+er als\b|\bam \w+sten\b/i, id:'comparative'},
    {pattern:/\b(was|wer|wo|wohin|woher|wann|wie|warum|welch)\b/i, id:'w-questions'},
    {pattern:/\b(geh!|komm!|mach!|sei!|geht!|kommt!|macht!|geben sie|warten sie)\b/i, id:'imperative'},
    {pattern:/\b(nicht|kein |keine |keinen |keinem )\b/i, id:'negation'},
    {pattern:/\b(hilft|gefällt|gehört|schmeckt|passt|fehlt|dankst)\b.*\b(mir|dir|ihm|ihr|uns|euch|ihnen)\b|\b(mir|dir|ihm|ihr|uns|euch)\b.*\b(hilft|gefällt|gehört|schmeckt|passt|fehlt|dankst)\b/i, id:'dative-verbs'},
    {pattern:/\b(um \d|am Montag|am Dienstag|am Mittwoch|am Donnerstag|am Freitag|am Samstag|am Sonntag|im Januar|im Februar|im März)\b/i, id:'time-expressions'},
    {pattern:/\b(der |die |das |den |dem |des |einen |einem |einer |eines )\b.*\w+(er|es|en|em|e)\b/i, id:'adj-ending'},
    {pattern:/\b(durch|für|ohne|gegen|um|aus|bei|mit|nach|seit|von|zu)\b/i, id:'prepositions'},
    {pattern:/\b(in |an |auf |über |unter |vor |hinter |neben |zwischen )\b/i, id:'prepositions'},
    {pattern:/\b(war|hatte|wurde|konnte|musste|durfte|sollte|wollte)\b/i, id:'simple-past'},
  ];
  const enPatterns = [
    {pattern:/\b(would|will|shall|can|could|may|might|must|should)\b/i, id:'en-modals'},
    {pattern:/\b(if|unless|provided that|even if)\b/i, id:'en-conditionals'},
    {pattern:/\b(am|is|are|was|were)\s+\w+ing\b/i, id:'en-tenses'},
    {pattern:/\b(has|have|had)\s+(been\s+)?\w+(ed|en)\b/i, id:'en-tenses'},
    {pattern:/\b(who|whom|whose|which|that|where|when)\b/i, id:'en-relative'},
    {pattern:/\b(although|though|even though|while|whereas|unless)\b/i, id:'en-linkers'},
    {pattern:/\b(enjoy|finish|avoid|mind|consider|suggest|practice|keep|imagine)\s+\w+ing\b/i, id:'en-gerund-infinitive'},
    {pattern:/\b(want|decide|hope|plan|promise|agree|refuse|learn|afford)\s+to\b/i, id:'en-gerund-infinitive'},
    {pattern:/\b(look after|give up|put off|turn down|look forward to|carry out|come across|bring up|run out of)\b/i, id:'en-phrasal'}
  ];
  const patterns = isEn ? enPatterns : deVerbPatterns;
  patterns.forEach(p => {
    if(p.pattern.test(text) && !hitIds.has(p.id)){
      const g = refs.find(gr => gr.id === p.id);
      if(g){ hits.push({...g, score:2}); hitIds.add(p.id); }
    }
  });

  // Sort by score
  hits.sort((a,b) => b.score - a.score);
  return hits.slice(0, 6);
}

const NOTES_KEY = 'linguaflow_notes';
let notesState = {tab:'word', langFilter:'all', quizMode:false, quizIdx:0, quizScore:0, quizItems:[]};
let uploadState = {show:false, source:'duolingo', imageData:null, ocrText:'', ocrItems:[], parsed:null, processing:false, tesseractReady:false};

function loadNotes(){
  try{
    const saved = localStorage.getItem(NOTES_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return {grammar:[], word:[], phrase:[]};
}
function saveNotesData(notes){
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }catch(e){}
}

function addToNote(category, content, detail){
  const notes = loadNotes();
  if(!notes[category]) notes[category] = [];
  // Avoid duplicates
  if(notes[category].find(n => n.content === content)){
    alert('该条目已在笔记中！');
    return;
  }
  notes[category].push({
    content, detail: detail || '',
    lang: state.lang,
    addedAt: new Date().toISOString().split('T')[0] + ' ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  });
  saveNotesData(notes);
  trackActivity('note', `${category}:${content}`);
  // 若当前正显示笔记面板，立即刷新
  if(state.module === 'notes') renderNotes();
  // Show brief confirmation
  const labels = {grammar:'语法',word:'单词',phrase:'常用句'};
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--success);color:#f5f2ed;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;animation:fadeIn .3s';
  toast.textContent = `✅ 已加入${labels[category]}笔记`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2000);
}

function removeNote(category, idx){
  const notes = loadNotes();
  if(notes[category]){
    notes[category].splice(idx, 1);
    saveNotesData(notes);
    renderNotes();
  }
}
