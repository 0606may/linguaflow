function startSpotQuiz(){
  const notes = loadNotes();
  const allItems = [
    ...(notes.grammar || []).map(n => ({...n, cat:'grammar'})),
    ...(notes.word || []).map(n => ({...n, cat:'word'})),
    ...(notes.phrase || []).map(n => ({...n, cat:'phrase'}))
  ];
  if(allItems.length < 2) return;

  // Shuffle and pick items
  const shuffled = allItems.sort(() => Math.random() - 0.5);
  notesState.quizItems = shuffled.slice(0, Math.min(10, shuffled.length));
  notesState.quizIdx = 0;
  notesState.quizScore = 0;
  notesState.quizMode = true;
  renderSpotQuiz();
}

function renderSpotQuiz(){
  const area = document.getElementById('contentArea');
  const items = notesState.quizItems;
  const idx = notesState.quizIdx;

  if(idx >= items.length){
    // Quiz complete
    const score = notesState.quizScore;
    const total = items.length;
    const pct = Math.round(score / total * 100);
    area.innerHTML = `<div class="fade-in" style="max-width:500px;margin:40px auto">
      <div class="card" style="text-align:center">
        <div style="font-size:48px;margin-bottom:16px">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>

        <div style="font-size:18px;color:var(--text-secondary)">答对 ${score} / ${total}（${pct}%）</div>
        <div style="margin-top:20px" class="btn-group" style="justify-content:center">
          <button class="btn btn-primary" onclick="startSpotQuiz()">🔄 再来一轮</button>
          <button class="btn" onclick="switchModule('notes')">返回笔记</button>
        </div>
      </div></div>`;
    trackActivity('spotquiz', `抽查 ${score}/${total}`);
    return;
  }

  const item = items[idx];
  let questionHtml = '';
  let optionsHtml = '';
  let answerHtml = '';

  if(item.cat === 'grammar'){
    // Show grammar title, ask for key content
    questionHtml = `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">📐 语法抽查 (${idx+1}/${items.length})</div>
      <div class="spot-question">「${item.content}」<br>属于哪个语法点？</div>`;
    // Generate options: correct + 3 random grammar topics
    const correctTitle = item.content;
    const grammarRef = state.lang === 'en' ? EN_GRAMMAR_REF : GRAMMAR_REF;
    const otherTopics = grammarRef.filter(g => g.title !== correctTitle).sort(() => Math.random()-0.5).slice(0,3).map(g => g.title);
    const options = [correctTitle, ...otherTopics].sort(() => Math.random()-0.5);
    optionsHtml = `<div class="spot-options">${options.map(o =>
      `<div class="spot-opt" onclick="checkSpotAnswer(this,'${o.replace(/'/g,"\\'")}','${correctTitle.replace(/'/g,"\\'")}')">${o}</div>`
    ).join('')}</div>`;
  } else {
    // Word/phrase: show target word, ask for meaning
    questionHtml = `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">${item.cat==='word'?'📝 单词抽查':'💬 常用句抽查'} (${idx+1}/${items.length})</div>
      <div class="spot-question">${item.content}</div>`;
    if(item.detail){
      answerHtml = `<div id="spotAnswer" style="display:none"><div class="spot-answer">✅ ${item.detail}</div>
        <div style="margin-top:12px"><button class="btn btn-primary" onclick="nextSpotQuestion()">⏭️ 下一题</button></div></div>`;
      optionsHtml = `<div style="margin-top:16px"><button class="btn btn-primary" onclick="showSpotAnswer()">👀 显示答案</button></div>`;
    } else {
      // No detail, just show the item and ask user to recall
      answerHtml = `<div id="spotAnswer" style="display:none"><div class="spot-answer">✅ 请回忆这个${item.cat==='word'?'单词':'句子'}的含义和用法</div>
        <div style="margin-top:12px"><button class="btn btn-primary" onclick="nextSpotQuestion()">⏭️ 下一题</button></div></div>`;
      optionsHtml = `<div style="margin-top:16px"><button class="btn btn-primary" onclick="showSpotAnswer()">👀 显示答案</button></div>`;
    }
  }

  area.innerHTML = `<div class="fade-in" style="max-width:600px;margin:20px auto">
    <div class="card">
      <div class="card-header">
        <div class="card-title">🎲 临时抽查</div>
        <div style="font-size:13px;color:var(--text-secondary)">得分：${notesState.quizScore}/${idx}</div>
      </div>
      <div class="spot-card">
        ${questionHtml}
        ${optionsHtml}
        ${answerHtml}
      </div>
      <div style="text-align:center">
        <button class="btn" onclick="switchModule('notes')">退出抽查</button>
      </div>
    </div></div>`;
}

function checkSpotAnswer(el, selected, correct){
  const allOpts = el.parentElement.querySelectorAll('.spot-opt');
  allOpts.forEach(o => {
    o.onclick = null;
    if(o.textContent === correct) o.classList.add('correct');
  });
  if(selected === correct){
    el.classList.add('correct');
    notesState.quizScore++;
  } else {
    el.classList.add('wrong');
  }
  setTimeout(() => nextSpotQuestion(), 1500);
}

function showSpotAnswer(){
  const el = document.getElementById('spotAnswer');
  if(el) el.style.display = 'block';
}

function nextSpotQuestion(){
  notesState.quizIdx++;
  renderSpotQuiz();
}

function startQuizGen(){
  const notes = loadNotes();
  const lf = notesState.langFilter;
  const wordNotes = (lf === 'all' ? [...(notes.word||[]), ...(notes.phrase||[])] : [...(notes.word||[]), ...(notes.phrase||[])].filter(n => n.lang === lf));
  const grammarNotes = lf === 'all' ? (notes.grammar||[]) : (notes.grammar||[]).filter(n => n.lang === lf);
  const lang = lf === 'all' ? (state.lang || 'en') : lf;

  const generators = [
    () => genReverseDefQ(wordNotes, lang),
    () => genSynonymQ(wordNotes, lang),
    () => genAntonymQ(wordNotes, lang),
    () => genIrregularQ(wordNotes, lang),
    () => genSpellingQ(wordNotes, lang),
    () => genGrammarAppQ(grammarNotes, lang)
  ];

  const items = [];
  const usedTypes = new Set();
  for(let i = 0; i < 10; i++){
    let q = null;
    let attempts = 0;
    while(!q && attempts < 20){
      const genIdx = i % generators.length;
      const gen = generators[genIdx];
      q = gen();
      attempts++;
      if(!q) generators.splice(genIdx, 1);
      if(generators.length === 0) break;
    }
    if(q) items.push(q);
  }

  if(items.length < 2){
    alert('无法生成足够题目，请增加笔记内容。');
    return;
  }

  quizGenState = {items, idx:0, score:0, lang};
  renderQuizGenQuestion();
}

  const q = items[idx];

function checkQuizGenAnswer(el, selectedIdx, correctIdx){
  const allOpts = el.parentElement.querySelectorAll('.spot-opt');
  allOpts.forEach(o => {
    o.onclick = null;
    const i = parseInt(o.dataset.idx);
    if(i === correctIdx) o.classList.add('correct');
  });
  if(selectedIdx === correctIdx){
    el.classList.add('correct');
    quizGenState.score++;
  } else {
    el.classList.add('wrong');
  }
  setTimeout(() => {
    quizGenState.idx++;
    renderQuizGenQuestion();
  }, 1500);
}

// ═══ 题型生成器 ═══
function genReverseDefQ(wordNotes, lang){
  if(wordNotes.length < 2) return null;
  const target = wordNotes[Math.floor(Math.random() * wordNotes.length)];
  if(!target.detail) return null;
  const distractors = wordNotes.filter(n => n.content !== target.content && n.detail).sort(() => Math.random()-0.5).slice(0,3).map(n => n.content);
  if(distractors.length < 3) return null;
  const options = [target.content, ...distractors].sort(() => Math.random()-0.5);
  return {
    typeLabel: '📝 反向释义',
    question: `释义「${target.detail}」对应的单词是？`,
    options,
    correctIdx: options.indexOf(target.content)
  };
}

function genSynonymQ(wordNotes, lang){
  const lib = lang === 'de' ? DE_SYNONYMS : EN_SYNONYMS;
  const matched = wordNotes.filter(n => lib.find(s => s.word.toLowerCase() === n.content.toLowerCase()));
  if(matched.length === 0) return null;
  const target = matched[Math.floor(Math.random() * matched.length)];
  const entry = lib.find(s => s.word.toLowerCase() === target.content.toLowerCase());
  if(!entry) return null;
  const correct = entry.synonyms[Math.floor(Math.random() * entry.synonyms.length)];
  const distractors = lib.filter(e => e.word !== target.content).sort(() => Math.random()-0.5).slice(0,3).map(e => e.synonyms[0]);
  const options = [correct, ...distractors].sort(() => Math.random()-0.5);
  return {
    typeLabel: '🔗 同义词选择',
    question: `哪个词与「${target.content}」意思最接近？`,
    options,
    correctIdx: options.indexOf(correct)
  };
}

function genAntonymQ(wordNotes, lang){
  const lib = lang === 'de' ? DE_ANTONYMS : EN_ANTONYMS;
  const matched = wordNotes.filter(n => lib.find(a => a.word.toLowerCase() === n.content.toLowerCase()));
  if(matched.length === 0) return null;
  const target = matched[Math.floor(Math.random() * matched.length)];
  const entry = lib.find(a => a.word.toLowerCase() === target.content.toLowerCase());
  if(!entry) return null;
  const correct = entry.antonym;
  const distractors = lib.filter(a => a.word !== target.content).sort(() => Math.random()-0.5).slice(0,3).map(a => a.antonym);
  const options = [correct, ...distractors].sort(() => Math.random()-0.5);
  return {
    typeLabel: '⚖️ 反义词选择',
    question: `「${target.content}」的反义词是？`,
    options,
    correctIdx: options.indexOf(correct)
  };
}

function genIrregularQ(wordNotes, lang){
  const lib = lang === 'de' ? DE_IRREGULAR : EN_IRREGULAR;
  const matched = wordNotes.filter(n => lib.find(v => v.base.toLowerCase() === n.content.toLowerCase()));
  if(matched.length === 0) return null;
  const target = matched[Math.floor(Math.random() * matched.length)];
  const entry = lib.find(v => v.base.toLowerCase() === target.content.toLowerCase());
  if(!entry) return null;
  const askPast = Math.random() > 0.5;
  const correct = askPast ? entry.past : entry.participle;
  const label = askPast ? '过去式' : '过去分词';
  const distractors = lib.filter(v => v.base !== target.content).sort(() => Math.random()-0.5).slice(0,3).map(v => askPast ? v.past : v.participle);
  const options = [correct, ...distractors].sort(() => Math.random()-0.5);
  return {
    typeLabel: '🔄 词形变位',
    question: `「${target.content}」的${label}是？`,
    options,
    correctIdx: options.indexOf(correct)
  };
}

function genSpellingQ(wordNotes, lang){
  if(wordNotes.length < 2) return null;
  const target = wordNotes[Math.floor(Math.random() * wordNotes.length)];
  const word = target.content;
  if(word.length < 3) return null;
  const distractors = [];
  for(let i = 0; i < 3; i++){
    let d = word.split('');
    const pos = Math.floor(Math.random() * d.length);
    const chars = 'abcdefghijklmnopqrstuvwxyzäöüß';
    d[pos] = chars[Math.floor(Math.random() * chars.length)];
    d = d.join('');
    if(d !== word && !distractors.includes(d)) distractors.push(d);
  }
  if(distractors.length < 3) return null;
  const options = [word, ...distractors].sort(() => Math.random()-0.5);
  return {
    typeLabel: '🔊 听力拼写',
    question: `听发音，选择正确的拼写。<br><button class="btn btn-sm" onclick="speak('${word.replace(/'/g,"\\'")}')">🔊 播放发音</button>`,
    options,
    correctIdx: options.indexOf(word)
  };
}

function genGrammarAppQ(grammarNotes, lang){
  if(grammarNotes.length < 2) return null;
  const target = grammarNotes[Math.floor(Math.random() * grammarNotes.length)];
  const ref = lang === 'de' ? GRAMMAR_REF : EN_GRAMMAR_REF;
  const matched = ref.find(r => target.content.toLowerCase().includes(r.title.toLowerCase()) || r.keywords.some(k => target.content.toLowerCase().includes(k.toLowerCase())));
  if(!matched || !matched.examples) return null;
  const correctEx = matched.examples.split('|')[0].trim();
  const distractors = grammarNotes.filter(n => n.content !== target.content).sort(() => Math.random()-0.5).slice(0,3).map(n => {
    const r = ref.find(x => n.content.toLowerCase().includes(x.title.toLowerCase()));
    return r && r.examples ? r.examples.split('|')[0].trim() : n.content;
  });
  if(distractors.length < 3) return null;
  const options = [correctEx, ...distractors].sort(() => Math.random()-0.5);
  return {
    typeLabel: '📐 语法应用',
    question: `哪句正确使用了「${target.content}」？`,
    options,
    correctIdx: options.indexOf(correctEx)
  };
}

function toggleUploadPanel(){
  uploadState.show = !uploadState.show;
  if(!uploadState.show){
    uploadState.imageData = null;
    uploadState.ocrText = '';
    uploadState.ocrItems = [];
    uploadState.parsed = null;
    uploadState.processing = false;
  }
  renderNotes();
}

function setUploadSource(src){
  uploadState.source = src;
  uploadState.imageData = null;
  uploadState.ocrText = '';
  uploadState.ocrItems = [];
  uploadState.parsed = null;
  renderNotes();
}

function handleUploadFile(input){
  const file = input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('请选择图片文件');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadState.imageData = e.target.result;
    uploadState.ocrText = '';
    uploadState.ocrItems = [];
    uploadState.parsed = null;
    renderNotes();
  };
  reader.readAsDataURL(file);
}

function removeUploadImage(){
  uploadState.imageData = null;
  uploadState.ocrText = '';
  uploadState.ocrItems = [];
  uploadState.parsed = null;
  renderNotes();
}

async function processOCR(){
  if(!uploadState.imageData) return;
  uploadState.processing = true;
  renderNotes();

  try {
    const lang = state.lang === 'de' ? 'deu' : 'eng';
    const extraLangs = state.lang === 'de' ? 'eng' : 'deu';
    const TesseractLib = await loadTesseract();
    const result = await TesseractLib.recognize(uploadState.imageData, `${lang}+${extraLangs}`, {
      logger: (m) => {
        if(m.status === 'recognizing text'){
          const pct = Math.round(m.progress * 100);
          const fill = document.querySelector('.op-fill');
          const label = document.querySelector('.op-label');
          if(fill) fill.style.width = pct + '%';
          if(label) label.textContent = `正在识别… ${pct}%`;
        }
      }
    });
    uploadState.ocrText = result.data.text.trim();
    uploadState.ocrItems = classifyOcrLines(uploadState.ocrText, uploadState.source);
    uploadState.parsed = smartParseText(uploadState.ocrText, state.lang);
    uploadState.processing = false;
    renderNotes();
  } catch(err){
    console.error('OCR failed:', err);
    uploadState.processing = false;
    alert('文字识别失败，请检查图片质量后重试');
    renderNotes();
  }
}

    if(base.endsWith('ing') && base.length > 5){
      const stem = base.slice(0,-3);
      candidates.push(stem, stem+'e', stem+stem[stem.length-1], base.slice(0,-3)+'e');
    }
    // -ed
    if(base.endsWith('ed') && base.length > 4){
      const stem = base.slice(0,-2);
      candidates.push(stem, stem+'e');
      if(stem.length>2) candidates.push(stem.slice(0,-1));
    }
    // -es / -s
    if(base.endsWith('es') && base.length > 4){
      candidates.push(base.slice(0,-2), base.slice(0,-2)+'e', base.slice(0,-1));
    } else if(base.endsWith('s') && base.length > 4){
      candidates.push(base.slice(0,-1), base.slice(0,-1)+'e');
    }
    // -er/-est 比较级
    if(base.endsWith('est') && base.length > 5) candidates.push(base.slice(0,-3), base.slice(0,-3)+'e');
    if(base.endsWith('er') && base.length > 4 && !w.includes(' ')) candidates.push(base.slice(0,-2), base.slice(0,-2)+'e');
  }
  // 去重并验证
  const seen = new Set();
  for(const c of candidates){
    const k = c.toLowerCase();
    if(k === w || seen.has(k) || k.length < 3) continue;
    seen.add(k);
    if(meaningOf(k)) return {lemma: k, found: true, viaRule:true};
  }
  // 4. 未还原成功
  return {lemma: w, found: false};
}

// 句子重组 + 噪声过滤
function rebuildSentences(text, lang){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const re = lang === 'de' ? /[a-zäöüß]/gi : /[a-z]/gi;
  const merged = [];
  let cur = '';
  let noise = 0;
  for(const line of lines){
    const letters = (line.match(re) || []).length;
    const ratio = letters / Math.max(line.length, 1);
    if(ratio < 0.4 || letters < 3){ noise++; continue; } // 噪声行（图标/乱码/符号）
    // 乱码预判：行内≥3字符的单词若全部无法解析 → 视为乱码行（如 "X EFF %) oo"）
    const lw = line.toLowerCase().match(lang === 'de' ? /[a-zäöüß']+/g : /[a-z']+/g) || [];
    const lw3 = lw.filter(x => x.length >= 3);
    if(lw3.length && !lw3.some(x => lemmatize(x, lang).found)){ noise++; continue; }
    cur = cur ? cur + ' ' + line : line;
    if(/[.!?。！？…]$/.test(cur) || cur.length > 90){
      merged.push(cur); cur = '';
    }
  }
  if(cur) merged.push(cur);
  // 二次过滤：可解析词占比过低的句子视为乱码
  const clean = merged.filter(s => {
    const words = s.toLowerCase().match(re.source === '[a-zäöüß]' ? /[a-zäöüß']+/g : /[a-z']+/g) || [];
    if(!words.length) return false;
    const resolvable = words.filter(w => w.length > 2 && lemmatize(w, lang).found).length;
    return resolvable / words.length >= 0.45;
  });
  noise += merged.length - clean.length;
  return {sentences: clean, noise};
}

// 德语形态特征检测（补充语法库）
function detectPatterns(sentence, lang){
  const pats = [];
  const lower = sentence.toLowerCase();
  if(lang === 'de'){
    if(/\b(ist|sind|bin|war|waren|hat|habe|hast|haben|hatte|wird|wurde|werden)\b[\s\S]*\bge\w+(t|en)\b/.test(lower) || /\bge\w+(t|en)\b[\s\S]*\b(ist|sind|bin|war|hat|habe|hast|haben|hatte|wird)\b/.test(lower)){
      pats.push('现在完成时 (Perfekt)');
    }
    if(/\b(mir|dir|ihm|ihr|uns|euch|ihnen|dem|der|den|einem|einer|meinem|meiner|deinem|deiner|seinem|seiner)\b/.test(lower)){
      pats.push('第三格 Dativ');
    }
    if(/\b(dich|dich|ihn|sie|es|uns|euch|den|das|die|einen|eine|ein)\b/.test(lower)){
      pats.push('第四格 Akkusativ');
    }
    if(/\b(mit|zu|nach|bei|von|aus|seit|gegenüber|außer)\b/.test(lower)){
      pats.push('介词搭配 Präposition');
    }
    if(/\bsich\b/.test(lower)) pats.push('反身动词 Reflexiv');
    if(/\b(dass|weil|wenn|obwohl|ob|als|nachdem|bevor|bis)\b/.test(lower)){
      pats.push('从句语序 Nebensatz');
    }
    if(/\b(kann|kannst|können|muss|musst|müssen|will|willst|wollen|soll|sollst|sollen|darf|darfst|dürfen|möchte|möchtest|möchten)\b/.test(lower)){
      pats.push('情态动词 Modalverb');
    }
    if(/\b(der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines)\b/.test(lower)){
      pats.push('冠词变格 Artikel');
    }
  } else {
    if(/\b(have|has|had)\s+\w+(ed|en)\b/.test(lower)) pats.push('现在完成时 Present Perfect');
    if(/\b(was|were)\s+\w+(ed|en)\b/.test(lower)) pats.push('过去时态 Past Tense');
    if(/\b(can|could|should|would|will|may|might|must|shall)\b/.test(lower)) pats.push('情态动词 Modals');
    if(/\b(if|unless|whether)\b/.test(lower)) pats.push('条件句 Conditionals');
    if(/\b(who|whom|whose|which|that|where|when)\b/.test(lower)) pats.push('定语从句 Relative Clause');
    if(/\b(although|though|because|since|while|whereas|however|therefore|moreover|furthermore)\b/.test(lower)) pats.push('连接词 Linkers');
    if(/\b(am|is|are|was|were)\s+\w+ed\b/.test(lower)) pats.push('被动语态 Passive');
    if(/\b(-?ing\b)/.test(lower) && /\b(am|is|are|was|were)\b/.test(lower)) pats.push('进行时 Progressive');
  }
  return pats;
}

// 语法主题匹配（关键词命中）
function detectGrammarTopics(sentence, lang){
  const refs = lang === 'en' ? EN_GRAMMAR_REF : GRAMMAR_REF;
  const generic = new Set(['der','die','das','ich','du','er','sie','es','wir','ihr','und','ein','eine','mit','von','zu','bei','in','auf','für','haben','sein','nicht','格','case','the','a','an','动词','verb']);
  const hits = [];
  for(const g of refs){
    const specific = (g.keywords || []).filter(k => k.length >= 4 && !generic.has(k.toLowerCase()));
    if(!specific.length) continue;
    let score = 0;
    for(const kw of specific){
      if(sentence.toLowerCase().includes(kw.toLowerCase())) score++;
    }
    if(score >= 2 || (specific.length <= 3 && score >= 1)){
      hits.push({id: g.id, title: g.title, content: (g.content || '').slice(0, 80)});
    }
  }
  return hits;
}

// 智能解析主入口
function smartParseText(text, lang){
  const {sentences, noise} = rebuildSentences(text, lang);
  const out = sentences.map(s => {
    const tokens = s.toLowerCase().match(lang === 'de' ? /[a-zäöüß']+/g : /[a-z']+/g) || [];
    const words = [];
    const seen = new Set();
    for(const t of tokens){
      if(t.length < 2) continue;
      const key = t;
      if(seen.has(key)) continue;
      seen.add(key);
      const res = lemmatize(t, lang);
      const dict = DICTIONARY[lang] || {}, extra = DICTIONARY_EXTRA[lang] || {}, runtime = _runtimeDict[lang] || {};
      const meaning = dict[res.lemma] || extra[res.lemma] || runtime[res.lemma] || '';
      words.push({token: t, lemma: res.lemma, found: res.found, meaning: meaning || '', changed: res.lemma !== t});
    }
    return {
      text: s,
      words,
      grammar: detectGrammarTopics(s, lang),
      patterns: detectPatterns(s, lang)
    };
  });
  return {sentences: out, noise};
}

function classifyOcrLines(text, source){
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const items = [];

  for(const line of lines){
    let category = 'word';
    let display = line;

    // Detect word-translation pairs with separators
    const sepMatch = line.match(/^(.+?)\s*[-–—=→:|]\s*(.+)$/);
    if(sepMatch){
      const left = sepMatch[1].trim();
      const right = sepMatch[2].trim();
      // If left side looks like a single word or short phrase
      if(left.split(/\s+/).length <= 3 && right.split(/\s+/).length <= 5){
        category = 'word';
        display = `${left} → ${right}`;
      } else {
        category = 'phrase';
        display = line;
      }
    }
    // Detect grammar rules (lines with keywords)
    else if(source === 'grammar' || /(?:der|die|das|den|dem|des|ein|eine|einem|einen|einer|ich bin|du bist|er ist|wir haben|Konjugation|Deklination|Präposition|Modalverb|Trennbar)/i.test(line)){
      category = 'grammar';
      display = line;
    }
    // Detect sentences (longer text with verbs)
    else if(line.split(/\s+/).length >= 5 || /[.!?,]$/.test(line)){
      category = 'phrase';
      display = line;
    }
    // Short text = likely a word
    else if(line.split(/\s+/).length <= 2){
      category = 'word';
      display = line;
    }
    // Default
    else {
      category = 'phrase';
      display = line;
    }

    items.push({text: display, category, selected: true});
  }
  return items;
}

function saveSelectedToNotes(){
  const selected = uploadState.ocrItems.filter(it => it.selected);
  if(selected.length === 0){
    alert('请至少选择一条内容');
    return;
  }
  const notes = loadNotes();
  let addedCount = 0;
  const now = new Date().toISOString().split('T')[0] + ' ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const srcLabel = uploadState.source === 'duolingo' ? '多邻国' : '语法书';

  for(const item of selected){
    const cat = item.category;
    if(!notes[cat]) notes[cat] = [];
    // Skip duplicates
    if(notes[cat].find(n => n.content === item.text)) continue;
    notes[cat].push({
      content: item.text,
      detail: `来源：${srcLabel}照片识别`,
      lang: state.lang,
      addedAt: now
    });
    addedCount++;
    trackActivity('note', `${cat}:${item.text}`);
  }

  saveNotesData(notes);

  // Remove saved items from the list
  uploadState.ocrItems = uploadState.ocrItems.filter(it => !it.selected);

  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--success);color:#f5f2ed;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;animation:fadeIn .3s';
  toast.textContent = `✅ 已保存 ${addedCount} 条到笔记`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2000);

  // If all items saved, close the OCR results
  if(uploadState.ocrItems.length === 0){
    uploadState.ocrText = '';
    uploadState.imageData = null;
  }
  renderNotes();
}

  document.querySelectorAll('.lang-btn, .ml-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  populateVoiceSelect();
  renderCurrentModule();
}
function switchModule(mod){
  try {
    state.module = mod;
    stopSpeaking();
    _grammarDetail = null;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.module === mod));
    document.querySelectorAll('.mm-item[data-module]').forEach(el => el.classList.toggle('active', el.dataset.module === mod));
    const titles = {listening:'🎧 听力训练',speaking:'🗣️ 口语跟读',reading:'📖 阅读查词',grammar:'📐 语法学习',daily:'📰 每日更新',quiz:'📝 听写测试',quizgen:'🎯 小测验',import:'📂 导入素材',progress:'📊 学习进度',activity:'📅 学习记录',query:'🔍 AI 查询',notes:'📒 学习笔记'};
    document.getElementById('topbarTitle').textContent = titles[mod] || mod;
    renderCurrentModule();
  } catch(e) {
    console.error('switchModule error:', e);
    const area = document.getElementById('contentArea');
    if(area) area.innerHTML = '<div class="card"><div class="empty-state"><div class="es-icon">⚠️</div><div class="es-text">模块加载出错，请刷新页面重试</div></div></div>';
  }
}

// 手机端快捷入口：弹出选择菜单（拍照 / 从相册选择）
function openCamera(){
  switchModule('notes');
  if(!uploadState.show) toggleUploadPanel();
  setTimeout(() => showCameraMenu(), 450);
}
function showCameraMenu(){
  const old = document.getElementById('cameraMenu');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.id = 'cameraMenu';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;-webkit-tap-highlight-color:transparent';
  overlay.innerHTML = `
    <div style="background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.15)">
      <div style="text-align:center;font-size:13px;color:var(--text-secondary);padding:2px 0 12px">选择图片来源</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button onclick="cameraPick('camera')" style="padding:14px;border-radius:12px;background:var(--primary);color:#f5f2ed;font-size:15px;border:none;font-weight:600">📷 拍照</button>
        <button onclick="cameraPick('gallery')" style="padding:14px;border-radius:12px;background:var(--highlight);color:var(--text);font-size:15px;border:none;font-weight:600">🖼️ 从相册选择</button>
        <button onclick="closeCameraMenu()" style="padding:11px;border-radius:12px;background:transparent;color:var(--text-secondary);font-size:14px;border:none">取消</button>
      </div>
    </div>`;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeCameraMenu(); });
  document.body.appendChild(overlay);
}
function cameraPick(which){
  closeCameraMenu();
  const id = which === 'camera' ? 'uploadInput' : 'uploadInputGallery';
  const inp = document.getElementById(id);
  if(inp){
    inp.value = '';
    inp.click();
  } else {
    const zone = document.getElementById('uploadZone');
    if(zone) zone.scrollIntoView({behavior:'smooth', block:'center'});
  }
}
function closeCameraMenu(){
  const old = document.getElementById('cameraMenu');
  if(old) old.remove();
}
function renderCurrentModule(){
  const renderers = {listening:renderListening,speaking:renderSpeaking,reading:renderReading,grammar:renderGrammar,daily:renderDaily,quiz:renderQuiz,quizgen:renderQuizGen,import:renderImport,progress:renderProgress,activity:renderActivity,query:renderQuery,notes:renderNotes};
  (renderers[state.module] || renderListening)();
}

window.addEventListener('load', ()=>{
  // Load saved progress
  loadProgress();
  // Init voices
  initVoices();
  synth.onvoiceschanged = initVoices;
  // Render initial module
  renderCurrentModule();

// ============================================================
// PWA: Service Worker + Install Prompt
// ============================================================
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      console.log('SW registered:', reg.scope);
    }).catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
  // SW 更新接管页面后自动刷新，确保总是打开最新版本
  let swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swReloaded) return;
    swReloaded = true;
    location.reload();
  });
}

// PWA install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner(){
  // Only show on mobile, not in standalone mode
  if(window.matchMedia('(max-width:768px)').matches && !window.matchMedia('(display-mode: standalone)').matches){
    const banner = document.createElement('div');
    banner.className = 'pwa-install';
    banner.textContent = '📲 添加到主屏幕，像 App 一样使用';
    banner.onclick = async () => {
      if(deferredPrompt){
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.remove();
        if(outcome === 'dismissed'){
          // User dismissed, don't show again for a while
          sessionStorage.setItem('pwa_dismissed', '1');
        }
      } else {
        // iOS: show manual instructions
        banner.textContent = '👆 点击 Safari 底部分享按钮 → "添加到主屏幕"';
        banner.onclick = () => banner.remove();
        setTimeout(() => banner.remove(), 5000);
      }
    };
    if(!sessionStorage.getItem('pwa_dismissed')){
      document.body.appendChild(banner);
    }
  }
}
</script>
