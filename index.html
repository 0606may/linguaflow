<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinguaFlow">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>LinguaFlow - 英语德语学习工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4F46E5;--primary-light:#818CF8;--primary-dark:#3730A3;
  --bg:#F8FAFC;--card:#FFF;--sidebar-bg:#1E293B;--sidebar-text:#CBD5E1;
  --text:#1E293B;--text-secondary:#64748B;--border:#E2E8F0;
  --success:#10B981;--warning:#F59E0B;--danger:#EF4444;
  --highlight:#FEF3C7;--highlight-sentence:#EEF2FF;
  --shadow:0 1px 3px rgba(0,0,0,.1);--shadow-lg:0 4px 12px rgba(0,0,0,.1);
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:220px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-brand{padding:20px;font-size:20px;font-weight:700;color:#FFF;text-align:center;border-bottom:1px solid rgba(255,255,255,.1);letter-spacing:1px}
.sidebar-brand small{display:block;font-size:11px;font-weight:400;color:var(--sidebar-text);margin-top:4px;letter-spacing:0}
.sidebar-section{padding:12px 16px 6px;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#475569}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:all .2s;font-size:14px;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(255,255,255,.05);color:#FFF}
.sidebar-item.active{background:rgba(79,70,229,.3);color:#FFF;border-left-color:var(--primary-light)}
.sidebar-item .icon{font-size:18px;width:24px;text-align:center}
.lang-switch{display:flex;margin:8px 16px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.lang-btn{flex:1;padding:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.lang-btn.active{background:var(--primary);color:#FFF}
.lang-btn:not(.active):hover{background:rgba(255,255,255,.05)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-title{font-size:18px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.content{flex:1;overflow-y:auto;padding:20px 24px}
/* Cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;color:var(--text)}
.btn:hover{background:#F1F5F9}
.btn-primary{background:var(--primary);color:#FFF;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#FFF;border-color:var(--success)}
.btn-danger{background:var(--danger);color:#FFF;border-color:var(--danger)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:16px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
/* Controls */
.control-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.control-label{font-size:12px;color:var(--text-secondary);min-width:50px}
.speed-slider{-webkit-appearance:none;width:120px;height:4px;border-radius:2px;background:#CBD5E1;outline:none}
.speed-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}
.speed-val{font-size:12px;font-weight:600;color:var(--primary);min-width:32px}
select.ctrl-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--card);cursor:pointer}
/* Material list */
.material-list{display:flex;flex-direction:column;gap:8px}
.material-card{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:space-between}
.material-card:hover{border-color:var(--primary-light);background:var(--highlight-sentence)}
.material-card.active{border-color:var(--primary);background:var(--highlight-sentence);box-shadow:0 0 0 2px rgba(79,70,229,.15)}
.material-card .mc-title{font-size:14px;font-weight:600}
.material-card .mc-meta{font-size:12px;color:var(--text-secondary);margin-top:3px}
.theme-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.theme-badge.daily{background:#DBEAFE;color:#1D4ED8}
.theme-badge.business{background:#FEF3C7;color:#92400E}
.theme-badge.culture{background:#D1FAE5;color:#065F46}
.theme-badge.exam{background:#FCE7F3;color:#9D174D}
/* Bilingual text */
.bilingual-block{margin:8px 0;padding:10px 14px;border-radius:var(--radius-sm);line-height:1.8;transition:background .2s}
.bilingual-block:hover{background:#F8FAFC}
.bilingual-block.highlight{background:var(--highlight-sentence);border-left:3px solid var(--primary)}
.bilingual-block.playing{background:#EEF2FF;border-left:3px solid var(--primary)}
.sentence-orig{font-size:16px;font-weight:500;cursor:pointer}
.sentence-orig .word{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .15s}
.sentence-orig .word:hover{background:var(--highlight)}
.sentence-orig .word.looked-up{background:#DBEAFE;border-bottom:2px solid var(--primary)}
.sentence-trans{font-size:14px;color:var(--text-secondary);margin-top:2px}
.sentence-idx{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#F1F5F9;font-size:11px;color:var(--text-secondary);margin-right:8px;flex-shrink:0}
/* Dictionary popup */
.dict-popup{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;min-width:240px;max-width:320px;z-index:1000;display:none}
.dict-popup.show{display:block}
.dict-word{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:4px}
.dict-phonetic{font-size:13px;color:var(--text-secondary);margin-bottom:8px}
.dict-meaning{font-size:14px;line-height:1.6}
.dict-meaning .pos{color:var(--primary);font-weight:600;margin-right:6px}
.dict-close{position:absolute;top:8px;right:10px;cursor:pointer;font-size:18px;color:var(--text-secondary)}
/* Writing */
.writing-area{width:100%;min-height:180px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;font-size:15px;line-height:1.8;resize:vertical;font-family:inherit;outline:none;transition:border-color .2s}
.writing-area:focus{border-color:var(--primary)}
.writing-prompt{padding:14px;background:#F8FAFC;border-radius:var(--radius-sm);margin-bottom:12px;border-left:3px solid var(--primary)}
.writing-prompt .wp-title{font-weight:600;margin-bottom:6px}
.writing-prompt .wp-hint{font-size:13px;color:var(--text-secondary);line-height:1.6}
.writing-stats{display:flex;gap:16px;font-size:12px;color:var(--text-secondary);margin-top:8px}
/* Quiz */
.quiz-input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-size:15px;outline:none;transition:border-color .2s}
.quiz-input:focus{border-color:var(--primary)}
.quiz-input.correct{border-color:var(--success);background:#ECFDF5}
.quiz-input.wrong{border-color:var(--danger);background:#FEF2F2}
.quiz-feedback{margin-top:8px;padding:10px;border-radius:var(--radius-sm);font-size:14px;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:#ECFDF5;color:#065F46}
.quiz-feedback.wrong{background:#FEF2F2;color:#991B1B}
/* Import */
.import-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:all .2s;color:var(--text-secondary)}
.import-zone:hover{border-color:var(--primary);color:var(--primary)}
.import-zone.dragover{border-color:var(--primary);background:var(--highlight-sentence)}
/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 18px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* Responsive */
@media(max-width:768px){
  .sidebar{width:60px}.sidebar-brand small,.sidebar-item span,.sidebar-section{display:none}.sidebar-brand{font-size:14px;padding:14px 4px}.sidebar-item{padding:12px;justify-content:center;border-left:none;border-right:3px solid transparent}.sidebar-item.active{border-left:none;border-right-color:var(--primary-light)}.lang-switch{flex-direction:column;margin:4px 8px}.grid-2{grid-template-columns:1fr}
}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#94A3B8}
/* Animation */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}
/* Record indicator */
.recording-indicator{display:inline-flex;align-items:center;gap:6px;color:var(--danger);font-size:13px;font-weight:600}
.recording-dot{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Word bank */
.word-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.word-chip{padding:4px 10px;background:#F1F5F9;border-radius:14px;font-size:12px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.word-chip:hover{background:var(--highlight-sentence);border-color:var(--primary-light)}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary)}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-text{font-size:15px}
/* Progress & Dashboard */
.progress-bar-bg{height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
.stat-card{text-align:center;padding:16px;background:#F8FAFC;border-radius:var(--radius-sm)}
.stat-card .stat-num{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:12px;color:var(--text-secondary);margin-top:4px}
.level-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;font-size:13px;font-weight:600}
.streak-fire{font-size:20px;animation:flicker 1.5s infinite alternate}
@keyframes flicker{0%{transform:scale(1)}100%{transform:scale(1.15)}}
.recommend-card{padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;margin-bottom:8px}
.recommend-card:hover{border-color:var(--primary-light);background:var(--highlight-sentence)}
.recommend-card .rc-title{font-size:14px;font-weight:600}
.recommend-card .rc-reason{font-size:12px;color:var(--primary);margin-top:3px}
.duo-sync-box{background:linear-gradient(135deg,#58CC02 0%,#45A825 100%);border-radius:var(--radius);padding:16px;color:#FFF;margin-bottom:16px}
.duo-sync-box .dsb-title{font-weight:700;font-size:15px;margin-bottom:8px}
.duo-sync-box .dsb-row{display:flex;justify-content:space-between;font-size:13px;opacity:.9;margin-top:4px}
.target-box{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);border-radius:var(--radius);padding:16px;color:#FFF;margin-bottom:16px}
.target-box .tb-title{font-weight:700;font-size:15px;margin-bottom:4px}
.target-box .tb-sub{font-size:13px;opacity:.85}
.activity-day{margin-bottom:16px}
.activity-day .ad-date{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.activity-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.activity-item .ai-icon{width:24px;text-align:center;font-size:14px}
.activity-item .ai-text{flex:1}
.activity-item .ai-time{color:var(--text-secondary);font-size:11px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px}
.setting-value{display:flex;align-items:center;gap:8px}
.duo-owl{font-size:32px;margin-right:8px}
/* Query module */
.query-box{position:relative}
.query-input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius);font-size:15px;outline:none;transition:border-color .2s}
.query-input:focus{border-color:var(--primary)}
.query-result{margin-top:16px;animation:fadeIn .3s}
.grammar-card{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:10px;cursor:pointer;transition:all .15s}
.grammar-card:hover{border-color:var(--primary-light);background:var(--highlight-sentence)}
.grammar-card .gc-title{font-weight:600;font-size:14px;color:var(--primary);margin-bottom:4px}
.grammar-card .gc-preview{font-size:13px;color:var(--text-secondary)}
.grammar-detail{padding:16px;background:#F8FAFC;border-radius:var(--radius-sm);margin-bottom:12px;border-left:3px solid var(--primary);animation:fadeIn .2s}
.grammar-detail .gd-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:8px}
.grammar-detail .gd-content{font-size:14px;line-height:1.8;white-space:pre-line}
.grammar-detail .gd-example{margin-top:8px;padding:8px 12px;background:#FFF;border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border)}
.dict-result{padding:16px;background:#F8FAFC;border-radius:var(--radius-sm);margin-bottom:12px}
.dict-result .dr-word{font-size:22px;font-weight:700;color:var(--primary)}
.dict-result .dr-phonetic{font-size:13px;color:var(--text-secondary);margin:4px 0 8px}
.dict-result .dr-meaning{font-size:14px;line-height:1.8}
.dict-result .dr-meaning .pos{color:var(--primary);font-weight:600;margin-right:6px}
/* Notes module */
.note-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)}
.note-tab{padding:10px 20px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.note-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.note-tab:hover{color:var(--text)}
.note-item{padding:14px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;transition:all .15s}
.note-item:hover{border-color:var(--primary-light)}
.note-item .ni-content{font-size:14px;font-weight:600}
.note-item .ni-detail{font-size:13px;color:var(--text-secondary);margin-top:4px;line-height:1.6}
.note-item .ni-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--text-secondary)}
/* Spot quiz */
.spot-card{padding:20px;text-align:center;background:linear-gradient(135deg,#EEF2FF,#F8FAFC);border-radius:var(--radius);margin-bottom:16px}
.spot-question{font-size:18px;font-weight:700;color:var(--text);margin:16px 0}
.spot-answer{font-size:15px;color:var(--success);margin-top:12px;animation:fadeIn .3s}
.spot-options{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0}
.spot-opt{padding:10px 20px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:14px;transition:all .15s;background:#FFF}
.spot-opt:hover{border-color:var(--primary-light);background:var(--highlight-sentence)}
.spot-opt.correct{border-color:var(--success);background:#ECFDF5;color:var(--success)}
.spot-opt.wrong{border-color:var(--danger);background:#FEF2F2;color:var(--danger)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* Photo Upload */
.upload-panel{background:#F8FAFC;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;animation:fadeIn .3s}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:#FFF}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--primary);background:var(--highlight-sentence)}
.upload-zone .uz-icon{font-size:36px;margin-bottom:8px}
.upload-zone .uz-text{font-size:14px;color:var(--text-secondary)}
.upload-zone .uz-hint{font-size:12px;color:var(--text-secondary);margin-top:4px;opacity:.7}
.upload-preview{position:relative;display:inline-block;max-width:100%;margin:12px 0}
.upload-preview img{max-width:100%;max-height:300px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.upload-preview .up-remove{position:absolute;top:-8px;right:-8px;width:24px;height:24px;background:var(--danger);color:#FFF;border:none;border-radius:50%;cursor:pointer;font-size:14px;line-height:24px;text-align:center}
.ocr-progress{margin:12px 0}
.ocr-progress .op-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.ocr-progress .op-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .3s}
.ocr-progress .op-label{font-size:12px;color:var(--text-secondary);margin-top:4px;text-align:center}
.ocr-result{margin-top:12px}
.ocr-result textarea{width:100%;min-height:120px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;font-size:14px;line-height:1.8;resize:vertical;font-family:inherit}
.ocr-result textarea:focus{outline:none;border-color:var(--primary)}
.ocr-items{margin-top:12px;max-height:360px;overflow-y:auto}
.ocr-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;background:#FFF;transition:all .15s}
.ocr-item:hover{border-color:var(--primary-light)}
.ocr-item.selected{border-color:var(--primary);background:var(--highlight-sentence)}
.ocr-item input[type=checkbox]{margin-top:3px;accent-color:var(--primary)}
.ocr-item .oi-text{flex:1;font-size:14px;line-height:1.6}
.ocr-item .oi-cat{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.source-tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid var(--border)}
.source-tab{padding:8px 18px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.source-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.source-tab:hover{color:var(--text)}
.batch-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
/* ============================================================
   MOBILE RESPONSIVE
   ============================================================ */
@media(max-width:768px){
  :root{--sidebar-w:0px;--bottom-nav-h:64px}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;
    width:100%;height:var(--bottom-nav-h);
    flex-direction:row;overflow-x:auto;overflow-y:hidden;
    padding:0;padding-bottom:env(safe-area-inset-bottom);
    z-index:100;border-top:1px solid rgba(255,255,255,.08);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .sidebar::-webkit-scrollbar{display:none}
  .sidebar-section{display:none}
  .sidebar-item{
    flex:0 0 auto;min-width:72px;
    flex-direction:column;padding:6px 4px;
    font-size:10px;gap:2px;text-align:center;
    justify-content:center;align-items:center;
  }
  .sidebar-item .icon{font-size:20px;margin:0}
  .sidebar-item span:not(.icon){font-size:10px;line-height:1.2}
  .main{
    margin-left:0;
    min-height:100vh;min-height:100dvh;
    padding-bottom:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom));
  }
  .topbar{
    position:sticky;top:0;z-index:50;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
    flex-wrap:wrap;gap:8px;
  }
  .topbar-right{
    width:100%;justify-content:space-between;
  }
  .topbar-title{font-size:16px}
  .content{padding:12px}
  .card{border-radius:var(--radius-sm);margin-bottom:12px}
  .card-header{flex-wrap:wrap;gap:8px}

function loadProgress(){
  try{
    const saved = localStorage.getItem('linguaflow_progress');
    if(saved){
      const parsed = JSON.parse(saved);
      if(parsed.en) state.progress.en = {...state.progress.en, ...parsed.en};
      if(parsed.de) state.progress.de = {...state.progress.de, ...parsed.de};
      if(parsed.dailyRecords) state.progress.dailyRecords = parsed.dailyRecords;
    }
  }catch(e){}
}
function saveProgress(){
  try{
    localStorage.setItem('linguaflow_progress', JSON.stringify(state.progress));
  }catch(e){}
}
function trackActivity(type, detail){
  const today = new Date().toISOString().split('T')[0];
  const now = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  state.progress.dailyRecords.push({date:today,time:now,type,detail});
  if(state.progress.dailyRecords.length > 500) state.progress.dailyRecords = state.progress.dailyRecords.slice(-500);
  saveProgress();
}
function markLessonComplete(matId){
  const lang = matId.split('-')[0];
  const p = state.progress[lang];
  if(p && !p.completedLessons.includes(matId)){
    p.completedLessons.push(matId);
    trackActivity('lesson', matId);
    saveProgress();
  } else {
    trackActivity('review', matId);
  }
}
function trackWordLookup(word, lang){
  const p = state.progress[lang];
  if(p && !p.wordsLookedUp.includes(word)){
    p.wordsLookedUp.push(word);
    saveProgress();
  }
}
function getRecommendations(lang){
  const p = state.progress[lang];
  const levels = DUO_LEVELS[lang] || [];
  const currentLevel = levels.find(l => l.id === p.duoLevel);
  const currentIdx = levels.findIndex(l => l.id === p.duoLevel);
  let recs = [];
  // Recommend next materials based on current level
  if(currentLevel){
    currentLevel.materials.forEach(mid => {
      const mat = MATERIALS.find(m => m.id === mid);
      if(mat && !p.completedLessons.includes(mid)){
        recs.push({material:mat, reason:'匹配当前进度'});
      }
    });
  }
  // Recommend materials from next level
  if(currentIdx >= 0 && currentIdx < levels.length - 1){
    const nextLevel = levels[currentIdx + 1];
    nextLevel.materials.forEach(mid => {
      const mat = MATERIALS.find(m => m.id === mid);
      if(mat && !p.completedLessons.includes(mid) && !recs.find(r=>r.material.id===mid)){
        recs.push({material:mat, reason:'下一步进阶内容'});
      }
    });
  }
  // If not enough recs, add uncompleted materials
  if(recs.length < 3){
    const allMats = MATERIALS.filter(m => m.lang === lang && !p.completedLessons.includes(m.id));
    allMats.forEach(mat => {
      if(!recs.find(r=>r.material.id===mat.id)){
        recs.push({material:mat, reason:'待学习'});
      }
    });
  }
  return recs.slice(0, 5);
}

// Google Translate TTS - natural human voice
function googleTTS(text, onEnd){
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  const lang = state.lang === 'en' ? 'en' : 'de';
  // Split long text into chunks (Google limit ~200 chars)
  const chunks = splitTextForTTS(text, 180);
  let idx = 0;
  function playChunk(){
    if(idx >= chunks.length){ if(onEnd) onEnd(); return; }
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(chunks[idx])}`;
    const audio = new Audio(url);
    audio.playbackRate = state.speed;
    currentAudio = audio;
    audio.onended = () => { idx++; playChunk(); };
    audio.onerror = () => {
      // Fallback to browser TTS if Google fails
      console.warn('Google TTS failed, falling back to browser TTS');
      ttsEngine = 'browser';
      document.getElementById('voiceSelect').value = 'browser';
      browserTTS(text, onEnd);
    };
    audio.play().catch(() => {
      ttsEngine = 'browser';
      document.getElementById('voiceSelect').value = 'browser';
      browserTTS(text, onEnd);
    });
  }
  playChunk();
}
function splitTextForTTS(text, maxLen){
  if(text.length <= maxLen) return [text];
  const chunks = [];
  let remaining = text;
  while(remaining.length > 0){
    if(remaining.length <= maxLen){ chunks.push(remaining); break; }
    let splitAt = remaining.lastIndexOf('. ', maxLen);
    if(splitAt < maxLen * 0.3) splitAt = remaining.lastIndexOf(', ', maxLen);
    if(splitAt < maxLen * 0.3) splitAt = remaining.lastIndexOf(' ', maxLen);
    if(splitAt < 0) splitAt = maxLen;
    chunks.push(remaining.substring(0, splitAt + 1));
    remaining = remaining.substring(splitAt + 1);
  }
  return chunks;
}
// Browser SpeechSynthesis - fallback
function browserTTS(text, onEnd){
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = state.lang === 'en' ? 'en-US' : 'de-DE';
  u.rate = state.speed;
  u.pitch = 1;
  if(onEnd) u.onend = onEnd;
  synth.speak(u);
  return u;
}
// Unified speak function
function speak(text, onEnd, onBoundary){
  stopAudio();
  if(ttsEngine === 'google'){
    googleTTS(text, onEnd);
  } else {
    browserTTS(text, onEnd);
  }
}
function stopAudio(){
  if(currentAudio){ try{ currentAudio.pause(); currentAudio.onended=null; }catch(e){} currentAudio=null; }
}
function speakSentenceBySentence(sentences, containerId, startIdx=0){
  stopAudio();
  synth.cancel();
  state.isPlaying = true;
  state.currentSentenceIdx = startIdx;
  function speakNext(idx){
    if(idx >= sentences.length || !state.isPlaying){
      state.isPlaying = false;
      state.currentSentenceIdx = -1;
      highlightSentence(containerId, -1);
      updatePlayBtn();
      return;
    }
    state.currentSentenceIdx = idx;
    highlightSentence(containerId, idx);
    speak(sentences[idx].orig, ()=> speakNext(idx+1));
  }
  speakNext(startIdx);
  updatePlayBtn();
}
function stopSpeaking(){
  synth.cancel();
  stopAudio();
  state.isPlaying = false;
  state.currentSentenceIdx = -1;
  updatePlayBtn();
}
function highlightSentence(containerId, idx){
  document.querySelectorAll(`#${containerId} .bilingual-block`).forEach((el,i)=>{
    el.classList.toggle('playing', i===idx);
    if(i===idx) el.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
}
function updatePlayBtn(){
  document.querySelectorAll('.play-toggle').forEach(btn=>{
    btn.textContent = state.isPlaying ? '⏸ 暂停' : '▶ 播放';
  });
}

function repeatMode(){
  if(!state.currentMaterial) return;
  stopSpeaking();
  state.isPlaying = true;
  updatePlayBtn();
  const sentences = state.currentMaterial.sentences;
  let idx = 0;
  function loopSentence(i){
    if(!state.isPlaying || i >= sentences.length){
      state.isPlaying = false;
      state.currentSentenceIdx = -1;
      highlightSentence('speakContent', -1);
      updatePlayBtn();
      return;
    }
    state.currentSentenceIdx = i;
    highlightSentence('speakContent', i);
    // Play 3 times with pauses
    let count = 0;
    function playOnce(){
      if(count >= 3 || !state.isPlaying){ loopSentence(i+1); return; }
      count++;
      speak(sentences[i].orig, ()=> setTimeout(playOnce, 800/state.speed));
    }
    playOnce();
  }
  loopSentence(0);
}
// Recording
let mediaRecorder = null;
let audioChunks = [];
let audioUrl = null;
async function toggleRecord(){
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  if(state.isRecording){
    mediaRecorder.stop();
    state.isRecording = false;
    btn.textContent = '🎤 开始录音';
    btn.classList.remove('btn-danger');
    btn.classList.add('btn-success');
    status.innerHTML = '✅ 录音完成 <button class="btn btn-sm" onclick="playRecord()">▶ 回放</button>';
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = ()=>{
      audioUrl = URL.createObjectURL(new Blob(audioChunks,{type:'audio/webm'}));
      stream.getTracks().forEach(t=>t.stop());
    };
    mediaRecorder.start();
    state.isRecording = true;
    btn.textContent = '⏹ 停止录音';
    btn.classList.remove('btn-success');
    btn.classList.add('btn-danger');

  }
  const m = state.currentMaterial;
  let sentencesHtml = m.sentences.map((s,i)=>{

      const clean = w.replace(/[^a-zA-ZäöüÄÖÜß'.-]/g,'');

      const lookedUp = state.lookedUpWords.has(clean.toLowerCase()) ? ' looked-up' : '';
      return `<span class="word${lookedUp}" onclick="onWordClick(event,'${clean.replace(/'/g,"\\'")}')">${w}</span>`;
    }).join('');
    return `<div class="bilingual-block" id="rb-${i}">

    <div class="card"><div class="card-header"><div class="card-title">选择素材</div></div>
    <div style="max-height:60vh;overflow-y:auto">${renderMaterialList('read-list','selectForReading')}</div></div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">${m.title} · 阅读</div>
        <div class="btn-group">
          <button class="btn btn-primary" onclick="readAllAloud()">🔊 朗读全文</button>
          <button class="btn" onclick="stopSpeaking()">⏹ 停止</button>

function selectForReading(id){
  stopSpeaking();
  state.currentMaterial = findMaterial(id);
  trackActivity('reading', id);
  renderReading();
}
function onWordClick(e, word){
  e.stopPropagation();
  const meaning = lookupWord(word);
  if(meaning){
    state.lookedUpWords.add(word.toLowerCase());
    e.target.classList.add('looked-up');
    showDictPopup(word, meaning, e.clientX, e.clientY);
    trackWordLookup(word.toLowerCase(), state.lang);
    trackActivity('word', word);
  } else {
    // Show "not found" briefly
    showDictPopup(word, '(词典中未找到，试试其他单词)', e.clientX, e.clientY);
  }
}
function playSingleRead(idx){
  if(!state.currentMaterial) return;
  stopSpeaking();
  highlightSentence('readContent', idx);
  speak(state.currentMaterial.sentences[idx].orig, ()=> highlightSentence('readContent', -1));
}
function readAllAloud(){
  if(!state.currentMaterial) return;
  speakSentenceBySentence(state.currentMaterial.sentences, 'readContent');
}

function renderWriting(){

    </div></div>`;

function selectWritingPrompt(idx){
  const prompts = WRITING_PROMPTS[state.lang] || [];
  const p = prompts[idx];
  if(!p) return;
  const wordBank = p.words.map(w=>`<span class="word-chip" onclick="insertWord('${w}')">${w}</span>`).join('');
  document.getElementById('writingPanel').innerHTML = `
    <div class="writing-prompt">
      <div class="wp-title">${p.title}</div>
      <div class="wp-hint">${p.hint}</div>
    </div>
    <div style="margin-bottom:8px;font-size:13px;color:var(--text-secondary)">参考词汇（点击插入）：</div>
    <div class="word-bank">${wordBank}</div>
    <textarea class="writing-area" id="writingText" placeholder="在这里开始写作..." oninput="updateWritingStats()"></textarea>
    <div class="writing-stats" id="writingStats">
      <span>字数：0</span><span>句子：0</span>
    </div>
    <div style="margin-top:12px" class="btn-group">
      <button class="btn btn-primary" onclick="checkWriting()">📝 检查</button>
      <button class="btn" onclick="clearWriting()">🗑️ 清空</button>
      <button class="btn" onclick="speakWriting()">🔊 朗读</button>
    </div>
    <div id="writingFeedback" style="margin-top:12px"></div>`;
}
function insertWord(w){
  const ta = document.getElementById('writingText');
  if(!ta) return;
  const pos = ta.selectionStart;
  const before = ta.value.substring(0,pos);
  const after = ta.value.substring(pos);
  ta.value = before + (before && !before.endsWith(' ') ? ' ':'') + w + ' ' + after;
  ta.focus();
  updateWritingStats();
}
function updateWritingStats(){
  const ta = document.getElementById('writingText');
  if(!ta) return;
  const text = ta.value.trim();
  const words = text ? text.split(/\s+/).length : 0;
  const sentences = text ? (text.match(/[.!?。！？]/g)||[]).length : 0;
  document.getElementById('writingStats').innerHTML = `<span>词数：${words}</span><span>句子：${sentences}</span>`;
}
function clearWriting(){
  const ta = document.getElementById('writingText');
  if(ta) ta.value = '';
  updateWritingStats();
  document.getElementById('writingFeedback').innerHTML = '';
}
function checkWriting(){
  const ta = document.getElementById('writingText');
  if(!ta || !ta.value.trim()){ return; }
  const prompts = WRITING_PROMPTS[state.lang] || [];
  // Find current prompt
  const title = document.querySelector('.writing-prompt .wp-title')?.textContent || '';
  const p = prompts.find(pr => pr.title === title);
  if(!p) return;
  const text = ta.value.toLowerCase();
  const usedWords = p.words.filter(w => text.includes(w.toLowerCase()));
  const unusedWords = p.words.filter(w => !text.includes(w.toLowerCase()));
  const wordCount = ta.value.trim().split(/\s+/).length;
  let feedback = `<div class="card" style="background:#F8FAFC">
    <div style="font-weight:600;margin-bottom:8px">📊 写作检查</div>
    <div style="font-size:13px;line-height:1.8">
    <div>词数：${wordCount} ${wordCount < 20 ? '⚠️ 建议写更多' : '✅'}</div>
    <div>已用参考词：${usedWords.length}/${p.words.length} ${usedWords.map(w=>`<span style="color:var(--success);font-weight:600">${w}</span>`).join(', ')||'无'}</div>
    ${unusedWords.length > 0 ? `<div>未用词汇：${unusedWords.map(w=>`<span style="color:var(--warning)">${w}</span>`).join(', ')}</div>` : '<div style="color:var(--success)">✅ 所有参考词汇都已使用！</div>'}
    </div></div>`;
  document.getElementById('writingFeedback').innerHTML = feedback;
}
function speakWriting(){
  const ta = document.getElementById('writingText');
  if(!ta || !ta.value.trim()) return;
  stopSpeaking();
  speak(ta.value.trim());
}

function renderQuizQuestion(){
  const m = state.currentMaterial;

    const score = window._quizScore || 0;

      <div style="font-size:18px;color:var(--text-secondary)">得分：${score} / ${total}（${pct}%）</div>
      <div style="margin-top:20px" class="btn-group" style="justify-content:center">
        <button class="btn btn-primary" onclick="selectForQuiz('${m.id}')">🔄 再来一次</button>

      </div></div>`;
    return;
  }
  const s = m.sentences[idx];
  const panel = document.getElementById('contentArea');
  panel.innerHTML = `<div class="card fade-in" style="max-width:600px;margin:20px auto">
    <div class="card-header">
      <div class="card-title">听写测试 (${idx+1}/${m.sentences.length})</div>
      <div style="font-size:13px;color:var(--text-secondary)">得分：${window._quizScore||0}</div>
    </div>
    <div style="text-align:center;margin:20px 0">
      <button class="btn btn-primary btn-icon" style="width:60px;height:60px;font-size:24px" onclick="playQuizAudio()">🔊</button>
      <div style="font-size:13px;color:var(--text-secondary);margin-top:8px">点击播放音频，然后输入你听到的内容</div>
    </div>
    <input type="text" class="quiz-input" id="quizInput" placeholder="输入你听到的内容..." onkeydown="if(event.key==='Enter')checkQuizAnswer()">
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div style="margin-top:12px" class="btn-group">
      <button class="btn btn-primary" onclick="checkQuizAnswer()">✅ 检查</button>
      <button class="btn" onclick="showQuizHint()">💡 提示</button>
      <button class="btn" onclick="nextQuizQuestion()">⏭️ 跳过</button>
    </div>
    <div id="quizHint" style="margin-top:12px;font-size:14px;color:var(--text-secondary);display:none"></div>
  </div>`;
}
function playQuizAudio(){
  if(!state.currentMaterial) return;
  const idx = window._quizIdx || 0;
  speak(state.currentMaterial.sentences[idx].orig);
}
function checkQuizAnswer(){
  const input = document.getElementById('quizInput');
  const fb = document.getElementById('quizFeedback');
  if(!input || !input.value.trim()) return;
  const m = state.currentMaterial;
  const idx = window._quizIdx || 0;
  const correct = m.sentences[idx].orig.toLowerCase().trim();
  const answer = input.value.trim().toLowerCase();
  // Simple similarity check
  const correctWords = correct.split(/\s+/);
  const answerWords = answer.split(/\s+/);
  let matches = 0;
  correctWords.forEach(w => {
    if(answerWords.some(aw => aw === w || (aw.length > 3 && w.includes(aw)))) matches++;
  });
  const ratio = matches / correctWords.length;
  if(ratio >= 0.7){
    input.classList.add('correct');
    input.classList.remove('wrong');
    fb.className = 'quiz-feedback show correct';
    fb.innerHTML = `✅ 正确！原文：<strong>${m.sentences[idx].orig}</strong><br>${m.sentences[idx].trans}`;
    window._quizScore = (window._quizScore||0) + 1;
  } else {
    input.classList.add('wrong');
    input.classList.remove('correct');
    fb.className = 'quiz-feedback show wrong';
    fb.innerHTML = `❌ 不太对。原文：<strong>${m.sentences[idx].orig}</strong><br>${m.sentences[idx].trans}`;
  }
  setTimeout(()=>{ window._quizIdx = idx + 1; renderQuizQuestion(); }, 2500);
}
function showQuizHint(){
  const m = state.currentMaterial;
  const idx = window._quizIdx || 0;
  const s = m.sentences[idx].orig;
  const words = s.split(/\s+/);
  const hint = words.map((w,i)=> i < Math.ceil(words.length*0.3) ? w : '___').join(' ');
  const el = document.getElementById('quizHint');
  el.style.display = 'block';
  el.innerHTML = `💡 提示：${hint}...`;
}
function nextQuizQuestion(){
  window._quizIdx = (window._quizIdx||0) + 1;
  renderQuizQuestion();
}

    ${state.customMaterials.length > 0 ? `
    <div style="margin-top:20px">

      ${state.customMaterials.map(m=>`<div class="material-card"><div><div class="mc-title">${m.title}</div><div class="mc-meta">${m.lang==='en'?'英语':'德语'} · ${m.sentences.length}句</div></div><button class="btn btn-sm" onclick="removeCustom('${m.id}')">删除</button></div>`).join('')}
    </div>` : ''}
  </div>`;
}
function handleImportDrop(e){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if(file) processImportFile(file);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(file) processImportFile(file);
}
function processImportFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.lang || !data.title || !data.sentences || !Array.isArray(data.sentences)){
        throw new Error('格式不正确');
      }
      const material = {
        id: 'custom-' + Date.now(),
        lang: data.lang,
        theme: data.theme || 'daily',
        difficulty: data.difficulty || '自定义',
        title: data.title,
        sentences: data.sentences.map(s => ({orig: s.orig, trans: s.trans}))
      };
      state.customMaterials.push(material);
      document.getElementById('importResult').innerHTML = `<div style="color:var(--success);font-size:14px">✅ 成功导入「${material.title}」(${material.sentences.length}句)</div>`;
      setTimeout(()=> renderImport(), 1500);
    }catch(err){
      document.getElementById('importResult').innerHTML = `<div style="color:var(--danger);font-size:14px">❌ 导入失败：${err.message}</div>`;
    }
  };
  reader.readAsText(file);
}
function removeCustom(id){
  state.customMaterials = state.customMaterials.filter(m=>m.id!==id);
  renderImport();
}

function setDuoLevel(levelId){
  const lang = state.lang;
  state.progress[lang].duoLevel = levelId;
  saveProgress();
  trackActivity('sync', `${lang==='en'?'英语':'德语'}多邻国→${levelId}`);
  renderProgress();
}
function setTargetLevel(targetId){
  const lang = state.lang;
  const targets = lang === 'en' ? EN_TARGETS : DE_TARGETS;
  const t = targets.find(t => t.id === targetId);
  state.progress[lang].targetLevel = targetId;
  state.progress[lang].targetLabel = t ? t.label : targetId;
  saveProgress();
  renderProgress();
}
function selectMaterialFromProgress(matId){
  const mat = findMaterial(matId);
  if(!mat) return;
  state.currentMaterial = mat;
  state.lang = mat.lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === mat.lang));
  populateVoiceSelect();
  switchModule('listening');
}
function getStreakCount(){
  const records = state.progress.dailyRecords;
  if(records.length === 0) return 0;
  const dates = [...new Set(records.map(r => r.date))].sort().reverse();
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if(dates[0] !== today && dates[0] !== yesterday) return 0;
  let streak = 1;
  for(let i = 0; i < dates.length - 1; i++){
    const d1 = new Date(dates[i]);
    const d2 = new Date(dates[i+1]);
    const diff = (d1 - d2) / 86400000;
    if(diff === 1) streak++;
    else break;
  }
  return streak;
}

function renderActivity(){
  const area = document.getElementById('contentArea');
  const records = state.progress.dailyRecords;
  const typeLabels = {listening:'听力训练',speaking:'口语跟读',reading:'阅读查词',writing:'写作练习',quiz:'听写测试',lesson:'完成课程',review:'复习课程',sync:'进度同步',word:'查词',import:'导入素材'};
  const typeIcons = {listening:'🎧',speaking:'🗣️',reading:'📖',writing:'✍️',quiz:'📝',lesson:'✅',review:'🔄',sync:'🦎',word:'📖',import:'📂'};

  // Group by date
  const grouped = {};
  records.slice().reverse().forEach(r => {
    if(!grouped[r.date]) grouped[r.date] = [];
    grouped[r.date].push(r);
  });
  const dates = Object.keys(grouped).sort().reverse();

  // Stats
  const today = new Date().toISOString().split('T')[0];
  const todayRecords = records.filter(r => r.date === today);
  const totalDays = new Set(records.map(r => r.date)).size;
  const totalWords = state.progress.en.wordsLookedUp.length + state.progress.de.wordsLookedUp.length;
  const totalLessons = state.progress.en.completedLessons.length + state.progress.de.completedLessons.length;

  let activityHtml = '';
  if(dates.length === 0){
    activityHtml = '<div class="empty-state"><div class="es-icon">📅</div><div class="es-text">暂无学习记录<br>开始学习后记录将自动出现在这里</div></div>';
  } else {
    dates.slice(0, 14).forEach(date => {
      const items = grouped[date];
      const dateLabel = date === today ? '今天' : date === new Date(Date.now()-86400000).toISOString().split('T')[0] ? '昨天' : date;
      activityHtml += `<div class="activity-day">
        <div style="font-weight:600;font-size:13px;margin-bottom:8px;color:var(--text)">${dateLabel} <span style="font-weight:400;color:var(--text-secondary)">(${items.length}条记录)</span></div>
        ${items.slice().reverse().map(r => `<div class="activity-item">
          <span>${typeIcons[r.type]||'📌'}</span>
          <span style="flex:1">${typeLabels[r.type]||r.type}${r.detail ? ' · ' + (findMaterial(r.detail)?.title || r.detail) : ''}</span>
          <span style="color:var(--text-secondary);font-size:12px">${r.time}</span>
        </div>`).join('')}
      </div>`;
    });
  }

  area.innerHTML = `<div class="fade-in" style="max-width:700px;margin:0 auto">
    <!-- Summary Stats -->
    <div class="grid-3" style="margin-bottom:16px">
      <div class="card stat-card">
        <div style="font-size:28px;font-weight:700;color:var(--primary)">${totalDays}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">学习天数</div>
      </div>
      <div class="card stat-card">
        <div style="font-size:28px;font-weight:700;color:var(--success)">${totalLessons}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">完成课程</div>
      </div>
      <div class="card stat-card">
        <div style="font-size:28px;font-weight:700;color:var(--warning)">${totalWords}</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">查阅单词</div>
      </div>
    </div>
    <!-- Activity Log -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📅 学习记录</div>
        ${records.length > 0 ? `<button class="btn btn-sm btn-danger" onclick="clearActivityLog()">清空记录</button>` : ''}
      </div>
      ${activityHtml}
    </div>
  </div>`;
}

function clearActivityLog(){
  if(confirm('确定要清空所有学习记录吗？此操作不可撤销。')){
    state.progress.dailyRecords = [];
    saveProgress();
    renderActivity();
  }
}

  queryResults = {dict:null, grammar:[], rawText:''};
  document.getElementById('queryResults').innerHTML = '';
}

function doQuery(){
  const input = document.getElementById('queryInput');
  if(!input || !input.value.trim()) return;
  const text = input.value.trim();
  queryResults.rawText = text;
  const container = document.getElementById('queryResults');
  container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-secondary)"><div class="loading-spinner"></div>查询中...</div>';

  // Determine query type
  const words = text.split(/\s+/);
  const isSingleWord = words.length === 1;

  // 1. Dictionary lookup
  let dictResult = null;
  if(isSingleWord){
    dictResult = lookupWordOnline(text.toLowerCase());
  }

  // 2. Grammar analysis (for phrases and sentences)
  let grammarHits = [];
  if(words.length >= 1){
    grammarHits = analyzeGrammar(text);
  }

  queryResults.dict = dictResult;
  queryResults.grammar = grammarHits;

  // Render results
  let html = '<div class="query-result">';

  // Dictionary result
  if(isSingleWord && dictResult){
    html += `<div class="dict-result">
      <div class="dr-word">${dictResult.word}</div>
      ${dictResult.phonetic ? `<div class="dr-phonetic">${dictResult.phonetic}</div>` : ''}
      <div class="dr-meaning"><span class="pos">${dictResult.lang==='en'?'英':'德'}</span> ${dictResult.meaning}</div>
      ${dictResult.extra ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">${dictResult.extra}</div>` : ''}
      <div style="margin-top:10px;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="speakQueryWord('${dictResult.word.replace(/'/g,"\\'")}')">🔊 发音</button>
        <button class="btn btn-sm btn-primary" onclick="addToNote('word','${dictResult.word.replace(/'/g,"\\'")}','${dictResult.meaning.replace(/'/g,"\\'")}')">📒 加入笔记</button>
      </div>
    </div>`;
  } else if(isSingleWord && !dictResult){
    html += `<div class="dict-result">
      <div class="dr-word">${text}</div>
      <div class="dr-meaning" style="color:var(--text-secondary)">本地词典未收录，试试查询短语或句子获取语法分析。</div>
      <div style="margin-top:10px">
        <button class="btn btn-sm" onclick="speakQueryWord('${text.replace(/'/g,"\\'")}')">🔊 发音</button>
      </div>
    </div>`;
  }

  // Grammar analysis results
  if(grammarHits.length > 0){
    html += `<div style="margin-top:16px"><div style="font-weight:600;font-size:14px;margin-bottom:10px">📐 相关语法点（${grammarHits.length}个）</div>`;
    grammarHits.forEach(g => {
      html += `<div class="grammar-card" onclick="toggleGrammarDetail('${g.id}')">
        <div class="gc-title">${g.title}</div>
        <div class="gc-preview">${g.content.substring(0,60)}...</div>
        <div id="gd-${g.id}" style="display:none" class="grammar-detail">
          <div class="gd-title">${g.title}</div>
          <div class="gd-content">${g.content}</div>
          ${g.examples ? `<div class="gd-example">📝 ${g.examples}</div>` : ''}
          <div style="margin-top:10px">
            <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();addToNote('grammar','${g.title.replace(/'/g,"\\'")}','${g.content.substring(0,120).replace(/'/g,"\\'")}')">📒 加入笔记</button>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  } else if(!isSingleWord){
    html += `<div style="margin-top:16px;padding:16px;background:#F8FAFC;border-radius:var(--radius-sm);text-align:center;color:var(--text-secondary)">
      <div style="font-size:14px">未找到直接相关的语法点</div>
      <div style="font-size:12px;margin-top:4px">试试输入包含动词、介词或语法关键词的句子</div>
    </div>`;
  }

  // Add to note button for full sentence
  if(words.length > 1){
    html += `<div style="margin-top:16px;padding:14px;background:var(--highlight-sentence);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:13px;color:var(--text-secondary)">将查询内容保存为常用句</div>
      <button class="btn btn-sm btn-primary" onclick="addToNote('phrase','${text.replace(/'/g,"\\'")}','')">📒 加入常用句笔记</button>
    </div>`;
  }

  html += '</div>';
  container.innerHTML = html;
}

function lookupWordOnline(word){
  word = word.toLowerCase().replace(/[^a-zäöüßéèêña-z]/gi,'');
  if(!word || word.length < 2) return null;
  // Check local dictionary first
  const localDict = DICTIONARY[state.lang] || {};
  if(localDict[word]){
    return {word, meaning: localDict[word], lang: state.lang, phonetic:'', extra:''};
  }
  // Check reverse dictionary (Chinese → target)
  const otherLang = state.lang === 'en' ? 'de' : 'en';
  const reverseDict = DICTIONARY[otherLang] || {};
  for(const [k,v] of Object.entries(reverseDict)){
    if(v.includes(word)){
      return {word:k, meaning:`${word} 的相关词`, lang:otherLang, phonetic:'', extra:`在${otherLang==='en'?'英':'德'}语词典中找到`};
    }
  }
  // Check other language dictionary
  const otherDict = DICTIONARY[otherLang] || {};
  if(otherDict[word]){
    return {word, meaning: otherDict[word], lang: otherLang, phonetic:'', extra:''};
  }
  return null;
}

function analyzeGrammar(text){
  const lower = text.toLowerCase();
  const words = lower.split(/\s+/);
  let hits = [];
  let hitIds = new Set();

  // Keyword matching
  GRAMMAR_REF.forEach(g => {
    let score = 0;
    g.keywords.forEach(kw => {
      const kwLower = kw.toLowerCase();
      if(words.includes(kwLower)) score += 3;
      else if(lower.includes(kwLower)) score += 1;
    });
    if(score > 0 && !hitIds.has(g.id)){
      hits.push({...g, score});
      hitIds.add(g.id);
    }
  });

  // Pattern-based detection
  // Detect verb forms
  const deVerbPatterns = [
    {pattern:/\b(ich bin|du bist|er ist|wir sind|ihr seid|sie sind)\b/i, id:'verb-conj'},
    {pattern:/\b(ich habe|du hast|er hat|wir haben)\b/i, id:'verb-conj'},
    {pattern:/\b(ich kann|du kannst|er kann|ich muss|du musst|ich will|du willst|ich möchte|du möchtest|ich darf|ich soll)\b/i, id:'modal-verbs'},
    {pattern:/\b(gegangen|gekommen|gefahren|aufgestanden|gemacht|gelesen|geschrieben|gegessen|getrunken|genommen|gegeben|gesprochen|gefunden|gedacht|gewesen|geworden)\b/i, id:'perfect'},
    {pattern:/\b(stehe.*auf|rufe.*an|kaufe.*ein|sehe.*fern|mache.*auf|mache.*zu|komme.*mit|gehe.*zurück)\b/i, id:'separable'},
    {pattern:/\b(mich|dich|sich|uns|euch)\b.*\b(wasche|freue|treffe|setze|stelle|wünsche)\b|\b(wasche|freue|treffe|setze|stelle|wünsche)\b.*\b(mich|dich|sich|uns|euch)\b/i, id:'reflexive'},
    {pattern:/\b(weil|dass|wenn|obwohl|seit|als ob)\b/i, id:'conjunctions'},
    {pattern:/\b(als|am .+sten|-er als)\b|\b\w+er als\b|\bam \w+sten\b/i, id:'comparative'},
    {pattern:/\b(was|wer|wo|wohin|woher|wann|wie|warum|welch)\b/i, id:'w-questions'},
    {pattern:/\b(geh!|komm!|mach!|sei!|geht!|kommt!|macht!|geben sie|warten sie)\b/i, id:'imperative'},
    {pattern:/\b(nicht|kein |keine |keinen |keinem )\b/i, id:'negation'},
    {pattern:/\b(hilft|gefällt|gehört|schmeckt|passt|fehlt|dankst)\b.*\b(mir|dir|ihm|ihr|uns|euch|ihnen)\b|\b(mir|dir|ihm|ihr|uns|euch)\b.*\b(hilft|gefällt|gehört|schmeckt|passt|fehlt|dankst)\b/i, id:'dative-verbs'},
    {pattern:/\b(um \d|am Montag|am Dienstag|am Mittwoch|am Donnerstag|am Freitag|am Samstag|am Sonntag|im Januar|im Februar|im März)\b/i, id:'time-expressions'},
    {pattern:/\b(der |die |das |den |dem |des |einen |einem |einer |eines )\b.*\w+(er|es|en|em|e)\b/i, id:'adj-ending'},
    {pattern:/\b(durch|für|ohne|gegen|um|aus|bei|mit|nach|seit|von|zu)\b/i, id:'prepositions'},
    {pattern:/\b(in |an |auf |über |unter |vor |hinter |neben |zwischen )\b/i, id:'prepositions'},
    {pattern:/\b(war|hatte|wurde|konnte|musste|durfte|sollte|wollte)\b/i, id:'simple-past'},
  ];
  deVerbPatterns.forEach(p => {
    if(p.pattern.test(text) && !hitIds.has(p.id)){
      const g = GRAMMAR_REF.find(gr => gr.id === p.id);
      if(g){ hits.push({...g, score:2}); hitIds.add(p.id); }
    }
  });

  // Sort by score
  hits.sort((a,b) => b.score - a.score);
  return hits.slice(0, 6);
}

const NOTES_KEY = 'linguaflow_notes';
let notesState = {tab:'word', quizMode:false, quizIdx:0, quizScore:0, quizItems:[]};
let uploadState = {show:false, source:'duolingo', imageData:null, ocrText:'', ocrItems:[], processing:false, tesseractReady:false};

function loadNotes(){
  try{
    const saved = localStorage.getItem(NOTES_KEY);
    if(saved) return JSON.parse(saved);
  }catch(e){}
  return {grammar:[], word:[], phrase:[]};
}
function saveNotesData(notes){
  try{ localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); }catch(e){}
}

function addToNote(category, content, detail){
  const notes = loadNotes();
  if(!notes[category]) notes[category] = [];
  // Avoid duplicates
  if(notes[category].find(n => n.content === content)){
    alert('该条目已在笔记中！');
    return;
  }
  notes[category].push({
    content, detail: detail || '',
    lang: state.lang,
    addedAt: new Date().toISOString().split('T')[0] + ' ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  });
  saveNotesData(notes);
  trackActivity('note', `${category}:${content}`);
  // Show brief confirmation
  const labels = {grammar:'语法',word:'单词',phrase:'常用句'};
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--success);color:#FFF;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;animation:fadeIn .3s';
  toast.textContent = `✅ 已加入${labels[category]}笔记`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2000);
}

function removeNote(category, idx){
  const notes = loadNotes();
  if(notes[category]){
    notes[category].splice(idx, 1);
    saveNotesData(notes);
    renderNotes();
  }
}

function renderNotes(){
  const area = document.getElementById('contentArea');
  const notes = loadNotes();
  const grammarNotes = notes.grammar || [];
  const wordNotes = [...(notes.word || []), ...(notes.phrase || [])];
  const totalNotes = grammarNotes.length + wordNotes.length;

  const tabClass = (t) => notesState.tab === t ? 'note-tab active' : 'note-tab';

  let listHtml = '';
  const items = notesState.tab === 'grammar' ? grammarNotes : wordNotes;

  if(items.length === 0){
    listHtml = `<div class="empty-state"><div class="es-icon">📒</div><div class="es-text">暂无${notesState.tab==='grammar'?'语法':'单词/常用句'}笔记<br>在 AI 查询中点击"加入笔记"，或通过"📷 拍照上传"识别图片添加</div></div>`;
  } else {
    const catLabel = notesState.tab === 'grammar' ? '语法' : (notes.word||[]).length > 0 && (notes.phrase||[]).length > 0 ? '' : '';
    items.forEach((n, i) => {
      const origCat = notes.word && notes.word.includes(n) ? '单词' : '常用句';
      listHtml += `<div class="note-item">
        <div class="ni-content">${n.content}</div>
        ${n.detail ? `<div class="ni-detail">${n.detail}</div>` : ''}
        <div class="ni-meta">
          <span class="theme-badge ${n.lang==='en'?'daily':'exam'}">${n.lang==='en'?'英语':'德语'}</span>
          ${notesState.tab !== 'grammar' && notes.word && notes.phrase ? `<span>${origCat}</span>` : ''}
          <span>${n.addedAt || ''}</span>
          <span style="margin-left:auto;cursor:pointer;color:var(--danger)" onclick="removeNote('${notesState.tab === 'grammar' ? 'grammar' : (notes.word && notes.word.includes(n) ? 'word' : 'phrase')}', ${i})">✕</span>
        </div>
      </div>`;
    });
  }

  area.innerHTML = `<div class="fade-in" style="max-width:700px;margin:0 auto">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📒 学习笔记</div>
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:12px;color:var(--text-secondary)">共 ${totalNotes} 条</span>
          <button class="btn btn-sm" onclick="toggleUploadPanel()" style="${uploadState.show?'background:var(--primary-light);color:#FFF':''}">📷 拍照上传</button>
          <button class="btn btn-sm btn-primary" onclick="startSpotQuiz()" ${totalNotes < 2 ? 'disabled title="至少需要2条笔记"' : ''}>🎲 临时抽查</button>
        </div>
      </div>
      ${uploadState.show ? renderUploadPanel() : ''}
      <div class="note-tabs">
        <div class="${tabClass('grammar')}" onclick="switchNoteTab('grammar')">📐 语法 (${grammarNotes.length})</div>
        <div class="${tabClass('word')}" onclick="switchNoteTab('word')">📝 单词及常用句 (${wordNotes.length})</div>
      </div>
      <div id="notesList">${listHtml}</div>
    </div>
  </div>`;
}

function switchNoteTab(tab){
  notesState.tab = tab;
  notesState.quizMode = false;
  renderNotes();
}

// SPOT QUIZ (临时抽查)
// ============================================================
function startSpotQuiz(){
  const notes = loadNotes();
  const allItems = [
    ...(notes.grammar || []).map(n => ({...n, cat:'grammar'})),
    ...(notes.word || []).map(n => ({...n, cat:'word'})),
    ...(notes.phrase || []).map(n => ({...n, cat:'phrase'}))
  ];
  if(allItems.length < 2) return;

  // Shuffle and pick items
  const shuffled = allItems.sort(() => Math.random() - 0.5);
  notesState.quizItems = shuffled.slice(0, Math.min(10, shuffled.length));
  notesState.quizIdx = 0;
  notesState.quizScore = 0;
  notesState.quizMode = true;
  renderSpotQuiz();
}

function renderSpotQuiz(){
  const area = document.getElementById('contentArea');
  const items = notesState.quizItems;
  const idx = notesState.quizIdx;

  if(idx >= items.length){
    // Quiz complete
    const score = notesState.quizScore;
    const total = items.length;
    const pct = Math.round(score / total * 100);
    area.innerHTML = `<div class="fade-in" style="max-width:500px;margin:40px auto">
      <div class="card" style="text-align:center">
        <div style="font-size:48px;margin-bottom:16px">${pct>=80?'🎉':pct>=60?'👍':'💪'}</div>
        <div style="font-size:24px;font-weight:700;margin-bottom:8px">抽查完成！</div>
        <div style="font-size:18px;color:var(--text-secondary)">答对 ${score} / ${total}（${pct}%）</div>
        <div style="margin-top:20px" class="btn-group" style="justify-content:center">
          <button class="btn btn-primary" onclick="startSpotQuiz()">🔄 再来一轮</button>
          <button class="btn" onclick="switchModule('notes')">返回笔记</button>
        </div>
      </div></div>`;
    trackActivity('spotquiz', `抽查 ${score}/${total}`);
    return;
  }

  const item = items[idx];
  let questionHtml = '';
  let optionsHtml = '';
  let answerHtml = '';

  if(item.cat === 'grammar'){
    // Show grammar title, ask for key content
    questionHtml = `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">📐 语法抽查 (${idx+1}/${items.length})</div>
      <div class="spot-question">「${item.content}」<br>属于哪个语法点？</div>`;
    // Generate options: correct + 3 random grammar topics
    const correctTitle = item.content;
    const otherTopics = GRAMMAR_REF.filter(g => g.title !== correctTitle).sort(() => Math.random()-0.5).slice(0,3).map(g => g.title);
    const options = [correctTitle, ...otherTopics].sort(() => Math.random()-0.5);
    optionsHtml = `<div class="spot-options">${options.map(o =>
      `<div class="spot-opt" onclick="checkSpotAnswer(this,'${o.replace(/'/g,"\\'")}','${correctTitle.replace(/'/g,"\\'")}')">${o}</div>`
    ).join('')}</div>`;
  } else {
    // Word/phrase: show target word, ask for meaning
    questionHtml = `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">${item.cat==='word'?'📝 单词抽查':'💬 常用句抽查'} (${idx+1}/${items.length})</div>
      <div class="spot-question">${item.content}</div>`;
    if(item.detail){
      answerHtml = `<div id="spotAnswer" style="display:none"><div class="spot-answer">✅ ${item.detail}</div>
        <div style="margin-top:12px"><button class="btn btn-primary" onclick="nextSpotQuestion()">⏭️ 下一题</button></div></div>`;
      optionsHtml = `<div style="margin-top:16px"><button class="btn btn-primary" onclick="showSpotAnswer()">👀 显示答案</button></div>`;
    } else {
      // No detail, just show the item and ask user to recall
      answerHtml = `<div id="spotAnswer" style="display:none"><div class="spot-answer">✅ 请回忆这个${item.cat==='word'?'单词':'句子'}的含义和用法</div>
        <div style="margin-top:12px"><button class="btn btn-primary" onclick="nextSpotQuestion()">⏭️ 下一题</button></div></div>`;
      optionsHtml = `<div style="margin-top:16px"><button class="btn btn-primary" onclick="showSpotAnswer()">👀 显示答案</button></div>`;
    }
  }

  area.innerHTML = `<div class="fade-in" style="max-width:600px;margin:20px auto">
    <div class="card">
      <div class="card-header">
        <div class="card-title">🎲 临时抽查</div>
        <div style="font-size:13px;color:var(--text-secondary)">得分：${notesState.quizScore}/${idx}</div>
      </div>
      <div class="spot-card">
        ${questionHtml}
        ${optionsHtml}
        ${answerHtml}
      </div>
      <div style="text-align:center">
        <button class="btn" onclick="switchModule('notes')">退出抽查</button>
      </div>
    </div></div>`;
}

function checkSpotAnswer(el, selected, correct){
  const allOpts = el.parentElement.querySelectorAll('.spot-opt');
  allOpts.forEach(o => {
    o.onclick = null;
    if(o.textContent === correct) o.classList.add('correct');
  });
  if(selected === correct){
    el.classList.add('correct');
    notesState.quizScore++;
  } else {
    el.classList.add('wrong');
  }
  setTimeout(() => nextSpotQuestion(), 1500);
}

function showSpotAnswer(){
  const el = document.getElementById('spotAnswer');
  if(el) el.style.display = 'block';
}

function nextSpotQuestion(){
  notesState.quizIdx++;
  renderSpotQuiz();
}

    uploadState.ocrItems = [];
    uploadState.processing = false;

function setUploadSource(src){

  uploadState.ocrText = '';

function handleUploadFile(input){
  const file = input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('请选择图片文件');
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    uploadState.imageData = e.target.result;
    uploadState.ocrText = '';
    uploadState.ocrItems = [];
    renderNotes();
  };
  reader.readAsDataURL(file);
}

function removeUploadImage(){
  uploadState.imageData = null;
  uploadState.ocrText = '';
  uploadState.ocrItems = [];
  renderNotes();
}

async function processOCR(){
  if(!uploadState.imageData) return;
  uploadState.processing = true;
  renderNotes();

  try {
    const lang = state.lang === 'de' ? 'deu' : 'eng';
    const extraLangs = state.lang === 'de' ? 'eng' : 'deu';
    const result = await Tesseract.recognize(uploadState.imageData, `${lang}+${extraLangs}`, {
      logger: (m) => {
        if(m.status === 'recognizing text'){
          const pct = Math.round(m.progress * 100);
          const fill = document.querySelector('.op-fill');
          const label = document.querySelector('.op-label');
          if(fill) fill.style.width = pct + '%';
          if(label) label.textContent = `正在识别… ${pct}%`;
        }
      }
    });
    uploadState.ocrText = result.data.text.trim();
    uploadState.ocrItems = classifyOcrLines(uploadState.ocrText, uploadState.source);
    uploadState.processing = false;
    renderNotes();
  } catch(err){
    console.error('OCR failed:', err);
    uploadState.processing = false;
    alert('文字识别失败，请检查图片质量后重试');
    renderNotes();
  }
}

function classifyOcrLines(text, source){
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const items = [];

  for(const line of lines){
    let category = 'word';
    let display = line;

    // Detect word-translation pairs with separators
    const sepMatch = line.match(/^(.+?)\s*[-–—=→:|]\s*(.+)$/);
    if(sepMatch){
      const left = sepMatch[1].trim();
      const right = sepMatch[2].trim();
      // If left side looks like a single word or short phrase
      if(left.split(/\s+/).length <= 3 && right.split(/\s+/).length <= 5){
        category = 'word';
        display = `${left} → ${right}`;
      } else {
        category = 'phrase';
        display = line;
      }
    }
    // Detect grammar rules (lines with keywords)
    else if(source === 'grammar' || /(?:der|die|das|den|dem|des|ein|eine|einem|einen|einer|ich bin|du bist|er ist|wir haben|Konjugation|Deklination|Präposition|Modalverb|Trennbar)/i.test(line)){
      category = 'grammar';
      display = line;
    }
    // Detect sentences (longer text with verbs)
    else if(line.split(/\s+/).length >= 5 || /[.!?,]$/.test(line)){
      category = 'phrase';
      display = line;
    }
    // Short text = likely a word
    else if(line.split(/\s+/).length <= 2){
      category = 'word';
      display = line;
    }
    // Default
    else {
      category = 'phrase';
      display = line;
    }

    items.push({text: display, category, selected: true});
  }
  return items;
}

function toggleOcrItem(idx){
  if(uploadState.ocrItems[idx]){
    uploadState.ocrItems[idx].selected = !uploadState.ocrItems[idx].selected;
    renderNotes();
  }
}

function changeOcrItemCat(idx, cat){
  if(uploadState.ocrItems[idx]){
    uploadState.ocrItems[idx].category = cat;
    renderNotes();
  }
}

function editOcrItemText(idx, newText){
  if(uploadState.ocrItems[idx]){
    uploadState.ocrItems[idx].text = newText;
  }
}

function saveSelectedToNotes(){
  const selected = uploadState.ocrItems.filter(it => it.selected);
  if(selected.length === 0){
    alert('请至少选择一条内容');
    return;
  }
  const notes = loadNotes();
  let addedCount = 0;
  const now = new Date().toISOString().split('T')[0] + ' ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const srcLabel = uploadState.source === 'duolingo' ? '多邻国' : '语法书';

  for(const item of selected){
    const cat = item.category;
    if(!notes[cat]) notes[cat] = [];
    // Skip duplicates
    if(notes[cat].find(n => n.content === item.text)) continue;
    notes[cat].push({
      content: item.text,
      detail: `来源：${srcLabel}照片识别`,
      lang: state.lang,
      addedAt: now
    });
    addedCount++;
    trackActivity('note', `${cat}:${item.text}`);
  }

  saveNotesData(notes);

  // Remove saved items from the list
  uploadState.ocrItems = uploadState.ocrItems.filter(it => !it.selected);

  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--success);color:#FFF;padding:10px 24px;border-radius:20px;font-size:14px;z-index:9999;animation:fadeIn .3s';
  toast.textContent = `✅ 已保存 ${addedCount} 条到笔记`;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(), 2000);

  // If all items saved, close the OCR results
  if(uploadState.ocrItems.length === 0){
    uploadState.ocrText = '';
    uploadState.imageData = null;
  }
  renderNotes();
}

function selectAllOcrItems(selectAll){
  uploadState.ocrItems.forEach(it => it.selected = selectAll);
  renderNotes();
}

function renderUploadPanel(){
  const srcTabs = `
    <div class="source-tabs">
      <div class="source-tab ${uploadState.source==='duolingo'?'active':''}" onclick="setUploadSource('duolingo')">📱 多邻国</div>
      <div class="source-tab ${uploadState.source==='grammar'?'active':''}" onclick="setUploadSource('grammar')">📕 语法书</div>
    </div>`;

  let bodyHtml = '';

  if(!uploadState.imageData){
    // Upload zone
    bodyHtml = `
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('uploadInput').click()"
           ondragover="event.preventDefault();this.classList.add('dragover')"
           ondragleave="this.classList.remove('dragover')"
           ondrop="event.preventDefault();this.classList.remove('dragover');handleDropFile(event)">
        <div class="uz-icon">📷</div>
        <div class="uz-text">点击上传或拖拽图片到此处</div>
        <div class="uz-hint">支持 JPG / PNG / HEIC，可拍照上传</div>
      </div>
      <input type="file" id="uploadInput" accept="image/*" capture="environment" style="display:none" onchange="handleUploadFile(this)">`;
  } else {
    // Image preview + OCR controls
    bodyHtml = `
      <div class="upload-preview">
        <img src="${uploadState.imageData}" alt="uploaded">
        <button class="up-remove" onclick="removeUploadImage()">✕</button>
      </div>`;

    if(uploadState.processing){
      bodyHtml += `
        <div class="ocr-progress">
          <div class="op-bar"><div class="op-fill" style="width:0%"></div></div>
          <div class="op-label">正在初始化识别引擎…</div>
        </div>`;
    } else if(uploadState.ocrItems.length > 0){
      // Show classified items
      const catLabels = {word:'单词', phrase:'常用句', grammar:'语法'};
      const catColors = {word:'background:#DBEAFE;color:#1D4ED8', phrase:'background:#D1FAE5;color:#065F46', grammar:'background:#FEF3C7;color:#92400E'};

      let itemsHtml = '';
      uploadState.ocrItems.forEach((item, i) => {
        itemsHtml += `
          <div class="ocr-item ${item.selected?'selected':''}" onclick="toggleOcrItem(${i})">
            <input type="checkbox" ${item.selected?'checked':''} onclick="event.stopPropagation();toggleOcrItem(${i})">
            <div class="oi-text" contenteditable="true" onblur="editOcrItemText(${i}, this.textContent)">${item.text}</div>
            <select class="oi-cat" style="${catColors[item.category]};border:none;cursor:pointer;font-size:11px;padding:2px 6px;border-radius:10px" onclick="event.stopPropagation()" onchange="changeOcrItemCat(${i}, this.value)">
              <option value="word" ${item.category==='word'?'selected':''}>单词</option>
              <option value="phrase" ${item.category==='phrase'?'selected':''}>常用句</option>
              <option value="grammar" ${item.category==='grammar'?'selected':''}>语法</option>
            </select>
          </div>`;
      });

      const selCount = uploadState.ocrItems.filter(it => it.selected).length;
      bodyHtml += `
        <div class="ocr-result">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px">📋 识别结果（点击文字可编辑，点击分类可修改）</div>
          <div class="ocr-items">${itemsHtml}</div>
          <div class="batch-actions">
            <button class="btn btn-sm" onclick="selectAllOcrItems(true)">全选</button>
            <button class="btn btn-sm" onclick="selectAllOcrItems(false)">取消全选</button>
            <span style="font-size:12px;color:var(--text-secondary)">已选 ${selCount} 条</span>
            <button class="btn btn-sm btn-primary" style="margin-left:auto" onclick="saveSelectedToNotes()" ${selCount===0?'disabled':''}>💾 保存选中到笔记</button>
          </div>
        </div>`;
    } else if(uploadState.ocrText){
      // OCR done but no items parsed - show raw text
      bodyHtml += `
        <div class="ocr-result">
          <div style="font-size:13px;font-weight:600;margin-bottom:8px">📋 识别结果（原始文本）</div>
          <textarea id="ocrRawText">${uploadState.ocrText}</textarea>
          <div class="batch-actions">
            <button class="btn btn-sm" onclick="reparseOcrText()">🔄 重新解析</button>
            <button class="btn btn-sm btn-primary" style="margin-left:auto" onclick="saveRawOcrAsNote()">💾 整体保存为笔记</button>
          </div>
        </div>`;
    } else {
      // Image loaded, OCR not yet run
      bodyHtml += `
        <div style="text-align:center;margin-top:12px">
          <button class="btn btn-primary" onclick="processOCR()">🔍 开始识别文字</button>
        </div>`;
    }
  }

  return `
    <div class="upload-panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:15px;font-weight:600">📷 照片上传识别</div>
        <button class="btn btn-sm" onclick="toggleUploadPanel()">收起 ✕</button>
      </div>
      ${srcTabs}
      ${bodyHtml}
    </div>`;
}

function handleDropFile(event){
  const file = event.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')){
    const fakeInput = {files: [file]};
    handleUploadFile(fakeInput);
  }
}

function reparseOcrText(){
  const textarea = document.getElementById('ocrRawText');
  if(textarea){
    uploadState.ocrText = textarea.value;
    uploadState.ocrItems = classifyOcrLines(uploadState.ocrText, uploadState.source);
    renderNotes();
  }
}

function saveRawOcrAsNote(){
  const textarea = document.getElementById('ocrRawText');
  if(!textarea || !textarea.value.trim()){
    alert('没有可保存的内容');
    return;
  }
  const cat = uploadState.source === 'grammar' ? 'grammar' : 'phrase';
  const srcLabel = uploadState.source === 'duolingo' ? '多邻国' : '语法书';
  addToNote(cat, textarea.value.trim(), `来源：${srcLabel}照片识别（整体保存）`);
  uploadState.ocrText = '';
  uploadState.imageData = null;
  uploadState.ocrItems = [];
  renderNotes();
}

// ============================================================
// NAVIGATION
// ============================================================
function switchLang(lang){
  state.lang = lang;
  state.currentMaterial = null;
  stopSpeaking();
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  populateVoiceSelect();
  renderCurrentModule();
}
function switchModule(mod){
  state.module = mod;
  stopSpeaking();
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.module === mod));
  const titles = {listening:'🎧 听力训练',speaking:'🗣️ 口语跟读',reading:'📖 阅读查词',writing:'✍️ 写作练习',quiz:'📝 听写测试',import:'📂 导入素材',progress:'📊 学习进度',activity:'📅 学习记录',query:'🔍 AI 查询',notes:'📒 学习笔记'};
  document.getElementById('topbarTitle').textContent = titles[mod] || mod;
  renderCurrentModule();
}
function renderCurrentModule(){
  const renderers = {listening:renderListening,speaking:renderSpeaking,reading:renderReading,writing:renderWriting,quiz:renderQuiz,import:renderImport,progress:renderProgress,activity:renderActivity,query:renderQuery,notes:renderNotes};
  (renderers[state.module] || renderListening)();
}
function stopSpeaking(){
  synth.cancel();
  stopAudio();
  state.isPlaying = false;
  state.currentSentenceIdx = -1;
  updatePlayBtn();
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', ()=>{
  // Load saved progress
  loadProgress();
  // Init voices
  initVoices();
  synth.onvoiceschanged = initVoices;
  // Render initial module
  renderCurrentModule();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      console.log('SW registered:', reg.scope);
    }).catch((err) => {
      console.warn('SW registration failed:', err);
    });
  });
}

// PWA install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner(){
  // Only show on mobile, not in standalone mode
  if(window.matchMedia('(max-width:768px)').matches && !window.matchMedia('(display-mode: standalone)').matches){
    const banner = document.createElement('div');
    banner.className = 'pwa-install';
    banner.textContent = '📲 添加到主屏幕，像 App 一样使用';
    banner.onclick = async () => {
      if(deferredPrompt){
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.remove();
        if(outcome === 'dismissed'){
          // User dismissed, don't show again for a while
          sessionStorage.setItem('pwa_dismissed', '1');
        }
      } else {
        // iOS: show manual instructions
        banner.textContent = '👆 点击 Safari 底部分享按钮 → "添加到主屏幕"';
        banner.onclick = () => banner.remove();
        setTimeout(() => banner.remove(), 5000);
      }
    };
    if(!sessionStorage.getItem('pwa_dismissed')){
      document.body.appendChild(banner);
    }
  }
}
